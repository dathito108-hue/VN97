vn97-p4e-diagnose = "vn97.p4_generation_diagnostic_cli:main"
vn97-p4e-boundary-eval = "vn97.p4_boundary_recovery_cli:main"
vn97-p4e-targeted-repair = "vn97.p4_targeted_repair_cli:main"
vn97-p4e-prefix-eval = "vn97.p4_chat_prefix_eval_cli:main"
vn97-p4e-compositional-repair = "vn97.p4_compositional_repair_cli:main"
vn97-p4e-reasoning-audit = "vn97.p4_reasoning_bottleneck_audit_cli:main"
vn97-p4e-numeric-arithmetic-repair = "vn97.p4_numeric_arithmetic_repair_cli:main"
vn97-p4e-arithmetic-coverage-repair = "vn97.p4_arithmetic_coverage_repair_cli:main"
