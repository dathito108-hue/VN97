[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn97"
version = "0.1.0"
description = "VN97 mobile-native recurrent intelligence research core"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.scripts]
vn97-train = "vn97.training_cli:main"
vn97-corpus-seal = "vn97.production_corpus_cli:main"
vn97-medium-pilot = "vn97.medium_pilot_cli:main"
vn97-p2-corpus-intake = "vn97.p2_corpus_intake_cli:main"
vn97-p3-corpus-intake = "vn97.p3_corpus_intake_cli:main"
vn97-p3-language-campaign = "vn97.p3_language_campaign_cli:main"
vn97-p3-gpu-preflight = "vn97.p3_gpu_preflight_cli:main"
vn97-p3-kaggle-candidate = "vn97.p3_kaggle_candidate_cli:main"
vn97-p3-kaggle-finalize = "vn97.p3_kaggle_finalize_cli:main"
vn97-p3-kaggle-prepare = "vn97.p3_kaggle_prepare_cli:main"
vn97-p3-kaggle-cached-candidate = "vn97.p3_kaggle_cached_candidate_cli:main"
vn97-p4-task-eval = "vn97.p4_task_evaluation_cli:main"
vn97-p4-core-finetune = "vn97.p4_core_finetune_cli:main"
vn97-p4d-generalization = "vn97.p4_generalization_cli:main"
vn97-p4e-diagnose = "vn97.p4_generation_diagnostic_cli:main"
vn97-p4e-boundary-eval = "vn97.p4_boundary_recovery_cli:main"
vn97-p4e-targeted-repair = "vn97.p4_targeted_repair_cli:main"
vn97-p4e-prefix-eval = "vn97.p4_chat_prefix_eval_cli:main"
vn97-p4e-compositional-repair = "vn97.p4_compositional_repair_cli:main"
vn97-p4e-reasoning-audit = "vn97.p4_reasoning_bottleneck_audit_cli:main"
vn97-p4e-numeric-arithmetic-repair = "vn97.p4_numeric_arithmetic_repair_cli:main"
vn97-p4e-arithmetic-coverage-repair = "vn97.p4_arithmetic_coverage_repair_cli:main"
vn97-p4e-interference-safe-reasoning = "vn97.p4_interference_safe_reasoning_cli:main"
vn97-p4e-arithmetic-mechanism-audit = "vn97.p4_arithmetic_mechanism_audit_cli:main"
vn97-p4e-numeric-beam-audit = "vn97.p4_numeric_beam_audit_cli:main"
vn97-p4e-sequence-ranking-repair = "vn97.p4_sequence_ranking_repair_cli:main"
vn97-p5a-scaled-foundation = "vn97.p5_scaled_foundation_cli:main"
vn97-p5b-mamba-transplant = "vn97.p5b_mamba_transplant_cli:main"
vn97-p5c-align = "vn97.p5c_alignment_cli:main"
vn97-p5d-plan = "vn97.p5d_plan_cli:main"
vn97-p5d1-teacher-corpus = "vn97.p5d_teacher_corpus_cli:main"
vn97-p2-source-fetch = "vn97.p2_source_fetch_cli:main"
vn97-p2-corpus-bundle = "vn97.p2_corpus_bundle_cli:main"
vn97-p2-pilot-handoff = "vn97.p2_pilot_handoff_cli:main"
vn97-speech-train = "vn97.speech_training_cli:main"
vn97-vision-train = "vn97.vision_training_cli:main"
vn97-bootstrap-release = "vn97.bootstrap_release_cli:main"
vn97-finetune = "vn97.continual_training_cli:main"
vn97-campaign = "vn97.campaign_cli:main"
vn97-production-campaign = "vn97.production_campaign_cli:main"
vn97-release-candidate = "vn97.release_candidate_cli:main"
vn97-production-release = "vn97.production_release_cli:main"
vn97-production-intake = "vn97.production_intake_cli:main"
vn97-production-run = "vn97.production_run_cli:main"
vn97-production-seal = "vn97.production_run_seal_cli:main"
vn97-device-evidence-campaign = "vn97.device_evidence_campaign_cli:main"
vn97-production-close = "vn97.production_closure_cli:main"
vn97-production-materialize = "vn97.production_materialization_cli:main"
vn97-turnkey-accept = "vn97.turnkey_acceptance_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
signing = ["cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
