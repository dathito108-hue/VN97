name: VN97 R2-K2Q Transfer Hash Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/kaggle_r2_k2q_prepare_android_runtime.sh"
      - ".github/workflows/r2-k2q-transfer-hash-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate transfer script
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/kaggle_r2_k2q_prepare_android_runtime.sh
          grep -F 'handle.read(8 * 1024 * 1024)' tools/kaggle_r2_k2q_prepare_android_runtime.sh
          if grep -F 'path.read_bytes()' tools/kaggle_r2_k2q_prepare_android_runtime.sh; then
            echo "multi-GB graph hashing must remain streaming" >&2
            exit 1
          fi
