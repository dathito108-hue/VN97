name: VN97 G06 Real Numerical Audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/g06-numeric-audit.yml'
      - 'tools/g06_numeric_audit.py'
      - 'tests/host_g06_numeric_audit.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: g06-real-numeric-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim ephemeral runner space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU audit engines
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install --disable-pip-version-check 'onnxruntime==1.26.0'
          mkdir -p "$RUNNER_TEMP/audit"
          python -m pip freeze > "$RUNNER_TEMP/audit/toolchain.txt"
          python tests/host_g06_numeric_audit.py
      - name: Download pinned original G03 capsule
        uses: actions/download-artifact@v4
        with:
          name: VN97-R2-G03-Mamba2-2.7B-7a2e931de9d48e0f230037796accc40d32fa16cc-36367075535
          path: ${{ runner.temp }}/g03-capsule
          repository: dathito108-hue/VN97
          run-id: 36367075535
          github-token: ${{ github.token }}
      - name: Generate real repeated-step references in separate process
        id: reference
        run: |
          set -euo pipefail
          python tools/g06_numeric_audit.py reference --capsule "$RUNNER_TEMP/g03-capsule" --output "$RUNNER_TEMP/reference" 2>&1 | tee "$RUNNER_TEMP/audit/reference.log"
          cp "$RUNNER_TEMP/reference/reference.json" "$RUNNER_TEMP/audit/"
          rm -rf "$RUNNER_TEMP/g03-capsule"
      - name: Download exact G06 candidate
        uses: actions/download-artifact@v4
        with:
          name: VN97-G06-UNQUALIFIED-CANDIDATE-36503256758
          path: ${{ runner.temp }}/candidate
          repository: dathito108-hue/VN97
          run-id: 36503256758
          github-token: ${{ github.token }}
      - name: Compare ONNX logits and recurrent continuation states
        run: |
          set -euo pipefail
          python tools/g06_numeric_audit.py compare --candidate "$RUNNER_TEMP/candidate" --reference "$RUNNER_TEMP/reference" --report "$RUNNER_TEMP/audit/numeric.json" 2>&1 | tee "$RUNNER_TEMP/audit/ort.log"
      - name: Preserve references without another source-weight download
        if: always() && steps.reference.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VN97-G06-NUMERIC-REFERENCES-${{ github.run_id }}
          path: ${{ runner.temp }}/reference
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve measured diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VN97-G06-NUMERIC-EVIDENCE-${{ github.run_id }}
          path: ${{ runner.temp }}/audit
          if-no-files-found: warn
          retention-days: 14
