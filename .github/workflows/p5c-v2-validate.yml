name: VN97 P5C v2 Validate

on:
  push:
    branches:
      - p5c-stable-fp32-warmup

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q             src/vn97/p5c_alignment.py             src/vn97/p5c_alignment_cli.py

      - name: Stable alignment contract
        run: |
          grep -q 'SEQUENCE_LENGTH = 128' src/vn97/p5c_alignment.py
          grep -q 'LEXICAL_WARMUP_STEPS = 50' src/vn97/p5c_alignment.py
          grep -q 'CORE_LR = 5e-6' src/vn97/p5c_alignment.py
          grep -q 'precision=fp32' src/vn97/p5c_alignment_cli.py
          grep -q 'requires_grad_' src/vn97/p5c_alignment_cli.py
          grep -q 'CORE UNFREEZE' src/vn97/p5c_alignment_cli.py
          grep -q 'loss.backward()' src/vn97/p5c_alignment_cli.py
          if grep -q 'torch.autocast' src/vn97/p5c_alignment_cli.py; then
            echo "unexpected autocast remains in P5C v2"
            exit 1
          fi
