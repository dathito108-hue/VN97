name: VN97 P4E-A Validate

on:
  push:
    branches:
      - p4e-a-generation-failure-diagnostic

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q \
            src/vn97/p4_artifact.py \
            src/vn97/p4_generation_diagnostic_cli.py \
            tests/host_p4e_diagnostic.py

      - name: Kaggle launcher syntax
        run: bash -n tools/kaggle_p4e_diagnose.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          scripts = data["project"]["scripts"]
          assert scripts["vn97-p4e-diagnose"] == "vn97.p4_generation_diagnostic_cli:main"
          PY

      - name: Diagnostic contract markers
        run: |
          grep -q 'VN97P4EADIAG1' src/vn97/p4_generation_diagnostic_cli.py
          grep -q 'GENERATED_JSON=' src/vn97/p4_generation_diagnostic_cli.py
          grep -q 'REJECTED_GENERALIZATION' src/vn97/p4_artifact.py
