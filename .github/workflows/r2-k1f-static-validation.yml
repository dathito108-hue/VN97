name: VN97 K1F Static Validation

on:
  push:
    branches:
      - r2-k1f-fp32-layerwise-parity

permissions:
  contents: read

concurrency:
  group: vn97-k1f-static
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/vn97/r2/mamba2_kaggle_real_parity.py
          bash -n tools/kaggle_r2_k1_real_parity.sh
