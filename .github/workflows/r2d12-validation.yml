name: R2-D12 targeted validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/vn97/r2/production_virtual_corpus.py"
      - "src/vn97/r2/production_virtual_corpus_cli.py"
      - "src/vn97/r2/production_registry.py"
      - "src/vn97/r2/production_streaming.py"
      - "src/vn97/r2/production_streaming_cli.py"
      - "src/vn97/r2/production_curriculum.py"
      - "src/vn97/r2/production_curriculum_cli.py"
      - "src/vn97/r2/__init__.py"
      - "tests/test_r2_production_virtual_corpus.py"
      - "tests/test_r2_production_registry.py"
      - "tests/test_r2_production_curriculum.py"
      - "tests/test_r2_production_streaming.py"
      - "pyproject.toml"
      - ".github/workflows/r2d12-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile R2-D12 modules
        run: python -m py_compile src/vn97/r2/production_virtual_corpus.py src/vn97/r2/production_virtual_corpus_cli.py src/vn97/r2/production_registry.py src/vn97/r2/production_streaming.py src/vn97/r2/production_streaming_cli.py src/vn97/r2/production_curriculum.py src/vn97/r2/production_curriculum_cli.py src/vn97/r2/__init__.py
      - name: Run R2-D12 targeted tests
        run: pytest -q tests/test_r2_production_virtual_corpus.py tests/test_r2_production_registry.py tests/test_r2_production_curriculum.py tests/test_r2_production_streaming.py
