name: R2-D1 targeted validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/vn97/r2/**"
      - "tests/test_r2_production_contract.py"
      - ".github/workflows/r2d1-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile R2 production contract
        run: python -m py_compile src/vn97/r2/production_contract.py
      - name: Run R2-D1 contract tests
        run: pytest -q tests/test_r2_production_contract.py
