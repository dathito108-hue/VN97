name: P5E4K temporary validation

on:
  push:
    branches:
      - p5e4k-generation-constraint-ablation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile src/vn97/p5e4k_generation_constraint_ablation_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5e4k_ablate.sh
      - name: P5E4K contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("src/vn97/p5e4k_generation_constraint_ablation_cli.py").read_text()
          pyproject = Path("pyproject.toml").read_text()
          launcher = Path("tools/kaggle_p5e4k_ablate.sh").read_text()
          required = [
              "DECODING_POLICY_GAIN",
              "DECODING_POLICY_PREFIX_GAIN_ONLY",
              "DECODING_POLICY_NO_MATERIAL_GAIN",
              "production_current",
              "no_ngram_block",
              "no_repetition_penalty",
              "pure_greedy",
              "ready_for_policy_promotion",
              '"ready_for_qat": False',
          ]
          missing = [item for item in required if item not in src]
          assert not missing, missing
          assert 'vn97-p5e4k-ablate = "vn97.p5e4k_generation_constraint_ablation_cli:main"' in pyproject
          assert "python -m vn97.p5e4k_generation_constraint_ablation_cli" in launcher
          PY
