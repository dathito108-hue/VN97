name: VN97 P4E-C Validate

on:
  push:
    branches:
      - p4e-c-targeted-generation-repair

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q \
            src/vn97/p4_targeted_repair_curriculum.py \
            src/vn97/p4_targeted_repair_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p4e_targeted_repair.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p4e-targeted-repair"] == "vn97.p4_targeted_repair_cli:main"
          PY

      - name: Repair contract markers
        run: |
          grep -q 'completion_aligned_p3_replay' src/vn97/p4_targeted_repair_cli.py
          grep -q 'encode_chat_completion_messages' src/vn97/p4_targeted_repair_cli.py
          grep -q 'REJECTED_RAW_GENERALIZATION' src/vn97/p4_targeted_repair_cli.py
          grep -q 'P4E_C_TRAIN_PER_CATEGORY = 600' src/vn97/p4_targeted_repair_curriculum.py
