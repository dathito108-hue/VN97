name: VN97 P5D3B Validate

on:
  push:
    branches:
      - p5d3b-relational-dynamics-distillation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q             src/vn97/p5d3_relational_distillation.py             src/vn97/p5d3_relational_distillation_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p5d3b_distill.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p5d3b-distill"] == "vn97.p5d3_relational_distillation_cli:main"
          PY

      - name: Distillation contract
        run: |
          grep -q 'STUDENT_HIDDEN_DEPTHS = (8, 16, 24, 32)' src/vn97/p5d3_relational_distillation.py
          grep -q 'TEACHER_HIDDEN_DEPTHS = (16, 32, 48, 64)' src/vn97/p5d3_relational_distillation.py
          grep -q 'TRAIN_STEPS = 500' src/vn97/p5d3_relational_distillation.py
          grep -q 'RELATIONAL_SIGNAL' src/vn97/p5d3_relational_distillation_cli.py
          grep -q 'forward_sequential_reference' src/vn97/p5d3_relational_distillation_cli.py
          grep -q 'state.p5d3b.pt' src/vn97/p5d3_relational_distillation_cli.py

      - name: Dual GPU launcher contract
        run: |
          grep -q 'run_candidate 0 0 &' tools/kaggle_p5d3b_distill.sh
          grep -q 'run_candidate 1 1 &' tools/kaggle_p5d3b_distill.sh
          grep -q 'MIN_FREE_BYTES' tools/kaggle_p5d3b_distill.sh
          grep -q 'VN97P5D3BSELECT' tools/kaggle_p5d3b_distill.sh
