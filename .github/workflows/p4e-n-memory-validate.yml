name: VN97 P4E-N Memory Validate

on:
  push:
    branches:
      - p4e-n-memory-safe-ranking

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q             src/vn97/p4_sequence_ranking_curriculum.py             src/vn97/p4_sequence_ranking_repair_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p4e_sequence_ranking_repair.sh

      - name: Memory-safe contract
        run: |
          grep -q 'default=2' src/vn97/p4_sequence_ranking_repair_cli.py
          grep -q 'with torch.no_grad()' src/vn97/p4_sequence_ranking_repair_cli.py
          grep -q 'preserve_loss.backward()' src/vn97/p4_sequence_ranking_repair_cli.py
          grep -q 'memory_safe_detached_negative_v1' src/vn97/p4_sequence_ranking_repair_cli.py
          grep -q 'expandable_segments:True' tools/kaggle_p4e_sequence_ranking_repair.sh
          grep -q 'v2-memory-safe' src/vn97/p4_sequence_ranking_curriculum.py
