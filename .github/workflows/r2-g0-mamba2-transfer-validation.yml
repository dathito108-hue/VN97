name: VN97 R2-G0 Mamba2 Transfer Validation

on:
  push:
    branches:
      - r2-g0-mamba2-27b-direct-transfer

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             "torch>=2.2,<3"
          python -m pip install --disable-pip-version-check "pytest>=8"
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Run Mamba2 transfer and evolution tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_r2_mamba2_transfer.py

      - name: Exercise config-only CLI
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mamba2-2.7b-config"
          mkdir -p "$ROOT"
          cat > "$ROOT/config.json" <<'JSON'
          {
            "d_model": 2560,
            "d_intermediate": 0,
            "n_layer": 64,
            "vocab_size": 50277,
            "ssm_cfg": {"layer": "Mamba2"},
            "attn_layer_idx": [],
            "attn_cfg": {},
            "rms_norm": true,
            "residual_in_fp32": true,
            "fused_add_norm": true,
            "pad_vocab_size_multiple": 16,
            "tie_embeddings": true
          }
          JSON
          vn97-r2-mamba2-transfer assess             --source-root "$ROOT"             --source-revision config-contract-test
