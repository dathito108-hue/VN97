name: VN97 R2-K2Q Split Script Fix Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/kaggle_r2_k2q_split_android_data.sh"
      - ".github/workflows/r2-k2q-split-script-fix.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell expansion
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/kaggle_r2_k2q_split_android_data.sh
          grep -F 'SOURCE="${1:-/kaggle/working/recurrent-8.onnx.data}"' tools/kaggle_r2_k2q_split_android_data.sh
          grep -F 'OUT_DIR="${2:-/kaggle/working/K2Q-PARTS}"' tools/kaggle_r2_k2q_split_android_data.sh
          grep -F 'CHUNK_MIB="${VN97_K2Q_CHUNK_MIB:-512}"' tools/kaggle_r2_k2q_split_android_data.sh
          if grep -F '\${1:-' tools/kaggle_r2_k2q_split_android_data.sh; then
            echo "escaped parameter expansion is forbidden" >&2
            exit 1
          fi
