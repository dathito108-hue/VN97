name: VN97 P5D2 Validate

on:
  push:
    branches:
      - p5d2-float-shadow-behavioral-distillation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q             src/vn97/p5d_behavioral_distillation.py             src/vn97/p5d_behavioral_distillation_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p5d2_distill.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p5d2-distill"] == "vn97.p5d_behavioral_distillation_cli:main"
          PY

      - name: Distillation profile contract
        run: |
          grep -q 'TARGET_D_MODEL = 1536' src/vn97/p5d_behavioral_distillation.py
          grep -q 'TARGET_LAYERS = 32' src/vn97/p5d_behavioral_distillation.py
          grep -q 'TARGET_D_STATE = 16' src/vn97/p5d_behavioral_distillation.py
          grep -q 'SEQUENCE_LENGTH = 96' src/vn97/p5d_behavioral_distillation.py
          grep -q 'MAX_TRAIN_WINDOWS = 1200' src/vn97/p5d_behavioral_distillation.py
          grep -q 'P3_REPLAY_RECORDS = 600' src/vn97/p5d_behavioral_distillation.py

      - name: Float-shadow and dual-GPU contract
        run: |
          grep -q 'set_float_shadow_mode(model, True)' src/vn97/p5d_behavioral_distillation_cli.py
          grep -q 'precision=fp32' src/vn97/p5d_behavioral_distillation_cli.py
          grep -q 'CUDA_VISIBLE_DEVICES' tools/kaggle_p5d2_distill.sh
          grep -q 'run_candidate 0 0 &' tools/kaggle_p5d2_distill.sh
          grep -q 'run_candidate 1 1 &' tools/kaggle_p5d2_distill.sh
          grep -q 'BEHAVIORAL_SIGNAL' src/vn97/p5d_behavioral_distillation_cli.py
          grep -q 'student-float.pt' src/vn97/p5d_behavioral_distillation_cli.py
