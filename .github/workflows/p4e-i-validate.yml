name: VN97 P4E-I Validate

on:
  push:
    branches:
      - p4e-i-numeric-arithmetic-repair

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q \
            src/vn97/p4_numeric_arithmetic_curriculum.py \
            src/vn97/p4_numeric_arithmetic_repair_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p4e_numeric_arithmetic_repair.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p4e-numeric-arithmetic-repair"] == "vn97.p4_numeric_arithmetic_repair_cli:main"
          PY

      - name: Numeric repair contract markers
        run: |
          grep -q '"numeric_copy": 3000' src/vn97/p4_numeric_arithmetic_curriculum.py
          grep -q '"place_value": 2200' src/vn97/p4_numeric_arithmetic_curriculum.py
          grep -q '"direct_arithmetic": 6200' src/vn97/p4_numeric_arithmetic_curriculum.py
          grep -q 'REJECTED_NUMERIC_COPY' src/vn97/p4_numeric_arithmetic_repair_cli.py
          grep -q 'REJECTED_REASONING' src/vn97/p4_numeric_arithmetic_repair_cli.py
          grep -q 'generate_chat_completion' src/vn97/p4_numeric_arithmetic_repair_cli.py
