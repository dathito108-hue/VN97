name: VN97 R2-K2Q Minimal Sidecar APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/app/src/k2q/AndroidManifest.xml"
      - ".github/workflows/r2-k2q-minimal-sidecar.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install pinned Android packages
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          TOOLS_ZIP="$RUNNER_TEMP/android-cmdline-tools.zip"
          TOOLS_DIR="$RUNNER_TEMP/android-cmdline-tools"
          curl -fsSL             "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"             -o "$TOOLS_ZIP"
          rm -rf "$TOOLS_DIR"
          mkdir -p "$TOOLS_DIR"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
          SDKMANAGER="$TOOLS_DIR/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER"             --sdk_root="$ANDROID_SDK_ROOT"             --channel=3             "platforms;android-37.0"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Build minimal K2Q APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace :app:assembleK2q

      - name: Verify minimal manifest
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/k2q/app-k2q.apk"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -s "$APK"

          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='ai.vn97.app.k2q'" "$RUNNER_TEMP/badging.txt"
          grep -F "application-label:'VN97 K2Q Evidence'" "$RUNNER_TEMP/badging.txt"
          grep -F "launchable-activity: name='ai.vn97.app.VN97R2OrtEvidenceActivity'" "$RUNNER_TEMP/badging.txt"

          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          if grep -E "uses-permission|permission:" "$RUNNER_TEMP/permissions.txt"; then
            echo "K2Q minimal sidecar must request zero Android permissions" >&2
            exit 1
          fi

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          if grep -E "VN97GameAccessibilityService|VN97FloatingAssistantService|VN97ScreenCaptureService|VN97GameAgentService|VN97ContinuationJobService" "$RUNNER_TEMP/manifest.txt"; then
            echo "K2Q minimal sidecar must not contain high-risk services" >&2
            exit 1
          fi

          sha256sum "$APK"

      - name: Upload minimal sidecar APK
        uses: actions/upload-artifact@v4
        with:
          name: VN97-R2-K2Q-minimal-installable
          path: android/app/build/outputs/apk/k2q/app-k2q.apk
          if-no-files-found: error
          retention-days: 7
