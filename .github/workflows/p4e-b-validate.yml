name: VN97 P4E-B Validate

on:
  push:
    branches:
      - p4e-b-chat-response-boundary-recovery

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q \
            src/vn97/chat_boundary.py \
            src/vn97/cognition_adapter.py \
            src/vn97/p4_boundary_recovery_cli.py \
            tests/host_p4e_boundary_recovery.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p4e_boundary_eval.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p4e-boundary-eval"] == "vn97.p4_boundary_recovery_cli:main"
          PY

      - name: Lightweight boundary unit tests
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("src/vn97/chat_boundary.py")
          spec = importlib.util.spec_from_file_location(
              "vn97_chat_boundary_light",
              path,
          )
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          recover = module.recover_chat_response_text

          assert recover("  answer  ") == "answer"
          assert recover(
              "legacy noise\n<|assistant|>\nwrong\n"
              "<|assistant|>\n"
              '{"capability":"web.fetch","requires_approval":false}\n'
          ) == '{"capability":"web.fetch","requires_approval":false}'
          assert recover(
              "noise\n<|assistant|>\nLan\n<|user|>\nnext"
          ) == "Lan"
          assert recover("<|assistant|>") == ""
          PY
