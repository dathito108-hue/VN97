name: VN97 P4E-H Validate

on:
  push:
    branches:
      - p4e-h-reasoning-bottleneck-audit

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q \
            src/vn97/p4_reasoning_bottleneck_audit_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p4e_reasoning_audit.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p4e-reasoning-audit"] == "vn97.p4_reasoning_bottleneck_audit_cli:main"
          PY

      - name: Audit contract markers
        run: |
          grep -q 'copy_pass_solve_fail' src/vn97/p4_reasoning_bottleneck_audit_cli.py
          grep -q 'first_top5' src/vn97/p4_reasoning_bottleneck_audit_cli.py
          grep -q 'teacher_correct' src/vn97/p4_reasoning_bottleneck_audit_cli.py
