name: R2-B final validation

on:
  push:
    branches:
      - r2b-compatibility-dense-pipeline

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
          python -m pip install -e . --no-deps
      - name: Syntax
        run: |
          python -m py_compile             src/vn97/r2/ssm.py             src/vn97/r2/model.py             src/vn97/r2/data_bridge.py             src/vn97/r2/dense_training.py             src/vn97/r2/fast_path_training.py             src/vn97/r2/dense_pilot_cli.py
          bash -n tools/vn97_r2_dense_pilot.sh
      - name: R2 focused tests
        run: |
          pytest -q             tests/test_r2_foundation.py             tests/test_r2_compatibility_dense.py
      - name: Build tiny canonical corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from vn97.tokenizer import VN97TokenizerPackage

          root = Path("/tmp/r2b-final")
          root.mkdir(parents=True, exist_ok=True)
          (root / "tokenizer.vn97tk1").write_bytes(
              VN97TokenizerPackage().to_bytes()
          )
          train = [
              {"messages":[
                  {"role":"user","content":"2+2?"},
                  {"role":"assistant","content":"4"}
              ]},
              {"messages":[
                  {"role":"user","content":"Say yes."},
                  {"role":"assistant","content":"yes"}
              ]},
          ]
          valid = [
              {"messages":[
                  {"role":"user","content":"1+1?"},
                  {"role":"assistant","content":"2"}
              ]}
          ]
          for name, rows in (("train", train), ("valid", valid)):
              with (root / f"{name}.jsonl").open("w", encoding="utf-8") as h:
                  for row in rows:
                      h.write(json.dumps(row) + "\n")
          PY
      - name: End-to-end dense smoke pilot
        run: |
          python -m vn97.r2.dense_pilot_cli             --tokenizer /tmp/r2b-final/tokenizer.vn97tk1             --train-jsonl /tmp/r2b-final/train.jsonl             --validation-jsonl /tmp/r2b-final/valid.jsonl             --work-dir /tmp/r2b-final/work             --output-dir /tmp/r2b-final/output             --profile smoke             --sequence-length 32             --stride 16             --batch-size 1             --epochs 1             --checkpoint-every 1             --device cpu
          test -f /tmp/r2b-final/output/model.r2.pt
          test -f /tmp/r2b-final/output/r2-dense-pilot-report.json
      - name: Parallel scan architecture contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          ssm = Path("src/vn97/r2/ssm.py").read_text()
          model = Path("src/vn97/r2/model.py").read_text()
          assert "affine_prefix_scan" in ssm
          assert "_causal_conv_sequence" in ssm
          assert "forward_hidden_reference" in model
          assert "self.layers[index](" in model
          PY
