name: VN97 P5E4C Label Dtype Fix Validate

on:
  push:
    branches:
      - p5e4c-label-dtype-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall -q src/vn97/p5e4c_decoder_repair_cli.py
      - name: Dtype contract
        run: |
          grep -q 'batch_inputs = cpu_inputs.to' src/vn97/p5e4c_decoder_repair_cli.py
          grep -q 'batch_labels = cpu_labels.to' src/vn97/p5e4c_decoder_repair_cli.py
          test "$(grep -c 'dtype=torch.long' src/vn97/p5e4c_decoder_repair_cli.py)" -ge 2
