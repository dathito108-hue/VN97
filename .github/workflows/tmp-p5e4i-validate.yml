name: P5E4I temporary validation

on:
  push:
    branches:
      - p5e4i-prefix-margin-repair

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile src/vn97/p5e4i_prefix_margin_repair_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5e4i_repair.sh
      - name: P5E4I contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("src/vn97/p5e4i_prefix_margin_repair_cli.py").read_text()
          pyproject = Path("pyproject.toml").read_text()
          launcher = Path("tools/kaggle_p5e4i_repair.sh").read_text()
          required = [
              "PREFIX_MARGIN_REPAIR_SIGNAL",
              "ready_for_next_decoding_stage",
              "FIRST_TOKEN_MARGIN = 1.5",
              "EARLY_4_MARGIN = 0.75",
              "MARGIN_WEIGHT = 0.6",
              "_state_hash(model, exclude_final_norm=False)",
              '"ready_for_qat": False',
              "parent_adapter_sha256",
          ]
          missing = [item for item in required if item not in src]
          assert not missing, missing
          assert 'vn97-p5e4i-repair = "vn97.p5e4i_prefix_margin_repair_cli:main"' in pyproject
          assert "python -m vn97.p5e4i_prefix_margin_repair_cli" in launcher
          PY
