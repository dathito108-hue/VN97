name: P5E4F temporary validation

on:
  push:
    branches:
      - p5e4f-fresh-output-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile src/vn97/p5e4f_fresh_output_validation_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5e4f_validate.sh
      - name: P5E4F contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("src/vn97/p5e4f_fresh_output_validation_cli.py").read_text()
          pyproject = Path("pyproject.toml").read_text()
          launcher = Path("tools/kaggle_p5e4f_validate.sh").read_text()
          required = [
              "FRESH_OUTPUT_GENERATION_GAIN",
              "ready_for_qat",
              "reused_p5e4d_manifest",
              "VN97OutputExpandedModel",
              "QAT_MIN_GENERATION_RATE = 0.10",
              "output-adapter.pt",
          ]
          missing = [item for item in required if item not in src]
          assert not missing, missing
          assert 'vn97-p5e4f-validate = "vn97.p5e4f_fresh_output_validation_cli:main"' in pyproject
          assert "python -m vn97.p5e4f_fresh_output_validation_cli" in launcher
          PY
