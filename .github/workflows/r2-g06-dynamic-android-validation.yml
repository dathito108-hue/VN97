name: VN97 R2-G0.6 Dynamic Android Validation

on:
  push:
    branches:
      - r2-g06-android-mamba2-single-graph-executor

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU ONNX runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             "torch>=2.6,<3"
          python -m pip install --disable-pip-version-check             "pytest>=8"             "onnx>=1.16,<2"             "onnxruntime>=1.18,<2"             "onnxscript>=0.1,<1"
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Validate dynamic sequence ONNX
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             src/vn97/r2/mamba2_dynamic_onnx.py             src/vn97/r2/mamba2_dynamic_onnx_cli.py
          python -m pytest -q             tests/test_r2_mamba2_g04_onnx.py             tests/test_r2_mamba2_g06_dynamic.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install pinned Android packages
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          TOOLS_ZIP="$RUNNER_TEMP/android-cmdline-tools.zip"
          TOOLS_DIR="$RUNNER_TEMP/android-cmdline-tools"
          curl -fsSL             "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"             -o "$TOOLS_ZIP"
          rm -rf "$TOOLS_DIR"
          mkdir -p "$TOOLS_DIR"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
          SDKMANAGER="$TOOLS_DIR/cmdline-tools/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER"             --sdk_root="$ANDROID_SDK_ROOT"             --channel=3             "platforms;android-37.0"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Compile Android runtime
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android             --no-daemon             --stacktrace             :runtime:assembleDebug

      - name: Prove real 5.4GB campaign remains manual
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/r2-g03-real-mamba2-capsule.yml").read_text()
          assert "workflow_dispatch:" in text
          assert "branches:" not in text
          PY
