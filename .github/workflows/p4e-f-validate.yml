name: VN97 P4E-F Validate

on:
  push:
    branches:
      - p4e-f-canonical-segmented-chat-prefix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q \
            src/vn97/training.py \
            src/vn97/cognition_adapter.py \
            src/vn97/p4_chat_prefix_eval_cli.py \
            tests/host_p4e_segmented_prefix.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p4e_prefix_eval.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p4e-prefix-eval"] == "vn97.p4_chat_prefix_eval_cli:main"
          PY

      - name: Prefix contract markers
        run: |
          grep -q 'encode_chat_completion_prompt' src/vn97/training.py
          grep -q 'generate_chat_completion' src/vn97/cognition_adapter.py
          grep -q 'canonical_recovered' src/vn97/p4_chat_prefix_eval_cli.py
