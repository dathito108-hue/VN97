name: VN97 R2-G0.5 Parallel Prefill Validation

on:
  push:
    branches:
      - r2-g05-mamba2-parallel-prefill

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU ONNX runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             "torch>=2.6,<3"
          python -m pip install --disable-pip-version-check             "pytest>=8"             "onnx>=1.16,<2"             "onnxruntime>=1.18,<2"             "onnxscript>=0.1,<1"
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             src/vn97/r2/mamba2_parallel_onnx.py             src/vn97/r2/mamba2_parallel_onnx_cli.py

      - name: Run G0.4 and G0.5 parity regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_r2_mamba2_g04_onnx.py             tests/test_r2_mamba2_g05_parallel.py

      - name: Prove real 5.4GB campaign remains manual
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/r2-g03-real-mamba2-capsule.yml").read_text()
          assert "workflow_dispatch:" in text
          assert "branches:" not in text
          PY
