name: VN97 Mobile ORT Buffers
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ort-buffers.yml'
      - 'android/runtime/ort-buffer-test/**'
      - 'android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtExecutionBuffers.kt'
      - 'android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtTensorStorage.kt'
      - 'android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtExecutor.kt'
permissions:
  contents: read
concurrency:
  group: mobile-ort-buffers-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  real-ort-io:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate checked identity graphs
        run: |
          python -m pip install 'onnx>=1.16,<2'
          python android/runtime/ort-buffer-test/generate_models.py
      - name: Verify real FP16 and FP32 pinned buffers
        run: gradle -p android/runtime/ort-buffer-test --no-daemon run
