name: R2-D2 targeted validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/vn97/scan.py"
      - "src/vn97/r2/model.py"
      - "src/vn97/r2/ssm.py"
      - "tests/test_r2_foundation.py"
      - "tests/test_r2_memory_efficient_training.py"
      - ".github/workflows/r2d2-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile changed modules
        run: python -m py_compile src/vn97/scan.py src/vn97/r2/ssm.py src/vn97/r2/model.py
      - name: Run R2-D2 tests
        run: pytest -q tests/test_r2_memory_efficient_training.py tests/test_r2_foundation.py
