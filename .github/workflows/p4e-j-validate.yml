name: VN97 P4E-J Validate

on:
  push:
    branches:
      - p4e-j-arithmetic-coverage-repair

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q \
            src/vn97/p4_arithmetic_coverage_curriculum.py \
            src/vn97/p4_arithmetic_coverage_repair_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p4e_arithmetic_coverage_repair.sh

      - name: Entrypoint
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p4e-arithmetic-coverage-repair"] == "vn97.p4_arithmetic_coverage_repair_cli:main"
          PY

      - name: Held-out safety markers
        run: |
          grep -q 'validation_expressions' src/vn97/p4_arithmetic_coverage_curriculum.py
          grep -q 'dev_forbidden_expressions' src/vn97/p4_arithmetic_coverage_repair_cli.py
          grep -q 'REJECTED_REASONING' src/vn97/p4_arithmetic_coverage_repair_cli.py
          grep -q 'min-reasoning-passes' src/vn97/p4_arithmetic_coverage_repair_cli.py
