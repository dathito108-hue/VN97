name: VN97 R2-K2A CUDA12 ORT Pin Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/kaggle_r2_k2a_real_onnx_parity.sh"
      - "src/vn97/r2/mamba2_kaggle_k2a_ort.py"
      - ".github/workflows/r2-k2a-cuda12-ort-pin-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static syntax validation
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/kaggle_r2_k2a_real_onnx_parity.sh
          python -m py_compile src/vn97/r2/mamba2_kaggle_k2a_ort.py

      - name: Validate CUDA 12 ORT campaign contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"onnxruntime-gpu==1.26.0"' tools/kaggle_r2_k2a_real_onnx_parity.sh
          grep -F 'expected_ort = "1.26.0"' tools/kaggle_r2_k2a_real_onnx_parity.sh
          grep -F 'ort.preload_dlls()' tools/kaggle_r2_k2a_real_onnx_parity.sh
          grep -F 'ort.preload_dlls()' src/vn97/r2/mamba2_kaggle_k2a_ort.py

      - name: Explain runtime boundary
        shell: bash
        run: |
          echo "Static validation only."
          echo "Real CUDAExecutionProvider activation remains a Kaggle T4 measurement."
