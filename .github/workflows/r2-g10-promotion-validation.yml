name: VN97 R2-G0.10 Promotion Validation

on:
  push:
    branches:
      - r2-g10-mamba2-evidence-promotion

permissions:
  contents: read

concurrency:
  group: vn97-r2-g10-promotion-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU Python test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             "torch>=2.2,<3"
          python -m pip install --disable-pip-version-check "pytest>=8"
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Run G0.10 promotion tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_r2_mamba2_g10_promotion.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile Android runtime
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace :runtime:compileDebugKotlin
