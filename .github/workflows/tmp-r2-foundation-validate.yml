name: R2 foundation temporary validation

on:
  push:
    branches:
      - r2-mobile-native-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
          python -m pip install -e . --no-deps
      - name: R2 syntax
        run: |
          python -m py_compile \
            src/vn97/r2/config.py \
            src/vn97/r2/ssm.py \
            src/vn97/r2/model.py \
            src/vn97/r2/capability.py \
            src/vn97/r2/checkpoint.py \
            src/vn97/r2/runtime.py \
            src/vn97/r2/training_plan.py \
            src/vn97/r2/evaluation.py \
            src/vn97/r2/bridge.py \
            src/vn97/r2/cpu_pilot_cli.py
          bash -n tools/vn97_r2_cpu_pilot.sh
      - name: R2 focused tests
        run: pytest -q tests/test_r2_foundation.py
      - name: R2 CPU smoke pilot
        run: python -m vn97.r2.cpu_pilot_cli --profile smoke --sequence-length 8
      - name: R2 architecture contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          arch = Path("docs/VN97_R2_ARCHITECTURE.md").read_text()
          model = Path("src/vn97/r2/model.py").read_text()
          training = Path("src/vn97/r2/training_plan.py").read_text()
          capability = Path("src/vn97/r2/capability.py").read_text()
          assert "One VN97 model" in arch
          assert "Dense intelligence first" in arch
          assert "class VN97R2Model" in model
          assert "R2TrainingStage.QAT" in training
          assert "merge_capability_delta" in capability
          PY
