name: VN97 P5D0 Validate

on:
  push:
    branches:
      - p5d0-distillation-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q             src/vn97/quantization.py             src/vn97/p5d_distillation.py             src/vn97/p5d_plan_cli.py

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p5d-plan"] == "vn97.p5d_plan_cli:main"
          PY

      - name: Teacher and target contract
        run: |
          grep -q 'Falcon3-Mamba-7B-Instruct' src/vn97/p5d_distillation.py
          grep -q 'TEACHER_LAYERS = 64' src/vn97/p5d_distillation.py
          grep -q 'TEACHER_D_MODEL = 4096' src/vn97/p5d_distillation.py
          grep -q 'TEACHER_D_STATE = 16' src/vn97/p5d_distillation.py
          grep -q 'TARGET_D_MODEL = 1536' src/vn97/p5d_distillation.py
          grep -q 'TARGET_LAYERS = 32' src/vn97/p5d_distillation.py
          grep -q 'TARGET_D_STATE = 16' src/vn97/p5d_distillation.py

      - name: Float-shadow contract
        run: |
          grep -q 'float_shadow_enabled = False' src/vn97/quantization.py
          grep -q 'def set_float_shadow_mode' src/vn97/quantization.py
          grep -q 'return self.weight' src/vn97/quantization.py
          grep -q 'TERNARY_DURING_INITIAL_DISTILLATION = False' src/vn97/p5d_distillation.py
