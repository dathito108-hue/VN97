name: VN97 P5D4A Cache Resume Validate

on:
  push:
    branches:
      - p5d4a-cache-aware-resume-disk-gate

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n tools/kaggle_p5d4a_teacher_expansion.sh
      - name: Cache-aware disk contract
        run: |
          grep -q 'reuse_existing_teacher_cache' tools/kaggle_p5d4a_teacher_expansion.sh
          grep -q 'CACHE_READY_BYTES' tools/kaggle_p5d4a_teacher_expansion.sh
          grep -q 'CACHED_RESUME_FREE_BYTES' tools/kaggle_p5d4a_teacher_expansion.sh
