name: VN97 P5D4A Static Cache Validate

on:
  push:
    branches:
      - p5d4a-static-cache-fast-generation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall -q src/vn97/p5d_teacher_corpus_cli.py
      - name: Static cache generation contract
        run: |
          grep -q 'use_cache=True' src/vn97/p5d_teacher_corpus_cli.py
          grep -q 'cache_implementation="static"' src/vn97/p5d_teacher_corpus_cli.py
