name: VN97 G06 Decode Specialization
on:
  pull_request:
    branches: [main]
    paths: ['tools/g06_decode_specialize.py', 'tools/g06_decode_benchmark.py', 'tests/test_g06_decode_specialize.py', '.github/workflows/g06-decode-specialize.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'onnx==1.22.0' 'onnxruntime==1.26.0' 'pytest>=8,<9'
      - run: python -m pytest tests/test_g06_decode_specialize.py -q
      - uses: actions/download-artifact@v4
        with:
          name: VN97-G06-INT8-UNQUALIFIED-36512587857
          path: ${{ runner.temp }}/candidate
          repository: dathito108-hue/VN97
          run-id: 36512587857
          github-token: ${{ github.token }}
      - name: Compare real recurrent outputs and warm latency
        run: python tools/g06_decode_benchmark.py --root "$RUNNER_TEMP/candidate" --result "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VN97-G06-DECODE-EVIDENCE-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/candidate/decode.onnx
            ${{ runner.temp }}/candidate/decode.json
          retention-days: 7
