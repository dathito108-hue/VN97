name: VN97 R2-K2Q Android FP16 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtRuntimePackage.kt"
      - "android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtTensorStorage.kt"
      - "android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtProviderProfiler.kt"
      - "android/app/src/main/java/ai/vn97/app/VN97R2OrtEvidenceActivity.kt"
      - "android/app/src/main/java/ai/vn97/app/VN97MainActivity.kt"
      - "android/app/src/main/AndroidManifest.xml"
      - "tools/kaggle_r2_k2q_prepare_android_runtime.sh"
      - "docs/VN97_R2_K2Q_ANDROID_FP16_DEVICE_EVIDENCE.md"
      - ".github/workflows/r2-k2q-android-fp16-validation.yml"

permissions:
  contents: read

jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install pinned Android packages
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          TOOLS_ZIP="$RUNNER_TEMP/android-cmdline-tools.zip"
          TOOLS_DIR="$RUNNER_TEMP/android-cmdline-tools"
          curl -fsSL             "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"             -o "$TOOLS_ZIP"
          rm -rf "$TOOLS_DIR"
          mkdir -p "$TOOLS_DIR"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
          SDKMANAGER="$TOOLS_DIR/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER"             --sdk_root="$ANDROID_SDK_ROOT"             --channel=3             "platforms;android-37.0"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Static K2Q transfer validation
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/kaggle_r2_k2q_prepare_android_runtime.sh

      - name: Compile Android app
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace :app:assembleDebug

      - name: Verify FP16 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'stateDtype in setOf("float16", "float32")'             android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtRuntimePackage.kt
          grep -F 'OnnxJavaType.FLOAT16'             android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtTensorStorage.kt
          grep -F 'Mamba2OrtValueDtype.fromRuntime(runtime.stateDtype)'             android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtProviderProfiler.kt

      - name: Verify K2Q activity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'VN97R2OrtEvidenceActivity' android/app/src/main/AndroidManifest.xml
          grep -F 'R2 Android ORT evidence' android/app/src/main/java/ai/vn97/app/VN97MainActivity.kt

      - name: Upload K2Q debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VN97-R2-K2Q-device-evidence-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
