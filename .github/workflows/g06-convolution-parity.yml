name: VN97 G06 Kernel Precision
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/vn97/r2/mamba2_parallel_onnx.py'
      - 'src/vn97/r2/mamba2_onnx.py'
      - 'tests/test_r2_mamba2_g05_parallel.py'
      - 'tests/host_g06_convolution_parity.py'
      - '.github/workflows/g06-convolution-parity.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test engine
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install --disable-pip-version-check 'pytest>=8,<9' 'onnx==1.22.0' 'onnxscript==0.7.2' 'onnxruntime==1.26.0'
          python -m pip install --no-deps -e .
      - name: Check exact step/chunk convolution parity
        run: python tests/host_g06_convolution_parity.py
      - name: Verify chunk state semantics and ONNX export on small fixtures
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m pytest tests/test_r2_mamba2_g05_parallel.py -q
