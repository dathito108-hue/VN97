name: VN97 G06 Convolution Precision
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/vn97/r2/mamba2_parallel_onnx.py'
      - 'tests/host_g06_convolution_parity.py'
      - '.github/workflows/g06-convolution-parity.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test engine
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Check exact step/chunk convolution parity
        run: python tests/host_g06_convolution_parity.py
