name: VN97 P4E-K Validate

on:
  push:
    branches:
      - p4e-k-interference-safe-reasoning

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q \
            src/vn97/p4_interference_safe_reasoning_curriculum.py \
            src/vn97/p4_interference_safe_reasoning_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p4e_interference_safe_reasoning.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p4e-interference-safe-reasoning"] == "vn97.p4_interference_safe_reasoning_cli:main"
          PY

      - name: Candidate safety contract
        run: |
          grep -q 'learning_rate=4e-6' src/vn97/p4_interference_safe_reasoning_curriculum.py
          grep -q 'learning_rate=3e-6' src/vn97/p4_interference_safe_reasoning_curriculum.py
          grep -q 'learning_rate=2e-6' src/vn97/p4_interference_safe_reasoning_curriculum.py
          grep -q 'max-tool-drop' src/vn97/p4_interference_safe_reasoning_cli.py
          grep -q 'max-copy-drop' src/vn97/p4_interference_safe_reasoning_cli.py
          grep -q 'EARLY STOP' src/vn97/p4_interference_safe_reasoning_cli.py
          grep -q 'load_deployment_checkpoint_file' src/vn97/p4_interference_safe_reasoning_cli.py
          grep -q 'held_out_expressions' src/vn97/p4_interference_safe_reasoning_curriculum.py
