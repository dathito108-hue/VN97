name: R2-E4 targeted validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/vn97/r2/onnx_autotune.py"
      - "src/vn97/r2/onnx_autotune_cli.py"
      - "src/vn97/r2/onnx_profiling.py"
      - "src/vn97/r2/__init__.py"
      - "tests/test_r2_onnx_autotune.py"
      - "tests/test_r2_onnx_profiling.py"
      - "android/runtime/src/main/java/ai/vn97/runtime/OrtAutotuning.kt"
      - "android/runtime/src/main/java/ai/vn97/runtime/OrtAdaptiveRuntime.kt"
      - "android/runtime/src/main/java/ai/vn97/runtime/OrtProviderProfiler.kt"
      - "android/runtime/build.gradle.kts"
      - "docs/VN97_R2E4_DYNAMIC_RUNTIME_AUTOTUNING.md"
      - "docs/VN97_R2_ARCHITECTURE.md"
      - "pyproject.toml"
      - ".github/workflows/r2e4-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install -e ".[dev,onnx]"
      - name: Compile E4 Python modules
        run: python -m py_compile src/vn97/r2/onnx_autotune.py src/vn97/r2/onnx_autotune_cli.py src/vn97/r2/__init__.py
      - name: Run E4 and E3 regression tests
        run: pytest -q tests/test_r2_onnx_autotune.py tests/test_r2_onnx_profiling.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Install pinned Android packages
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          TOOLS_ZIP="$RUNNER_TEMP/android-cmdline-tools.zip"
          TOOLS_DIR="$RUNNER_TEMP/android-cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" -o "$TOOLS_ZIP"
          rm -rf "$TOOLS_DIR"
          mkdir -p "$TOOLS_DIR"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
          SDKMANAGER="$TOOLS_DIR/cmdline-tools/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Compile Android E4 autotuner with ONNX Runtime
        run: gradle -p android --no-daemon --stacktrace :runtime:compileDebugKotlin
