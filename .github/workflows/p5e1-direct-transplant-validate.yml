name: VN97 P5E1 Direct Transplant Validate

on:
  push:
    branches:
      - p5e1-direct-ssm-operator-transplant

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall -q src/vn97/p5e_direct_ssm_transplant_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5e_direct_ssm_transplant.sh
      - name: Direct transplant contract
        run: |
          grep -q 'teacher_generation=false' src/vn97/p5e_direct_ssm_transplant_cli.py
          grep -q 'layer_compression=64_to_32_pair_endpoints' src/vn97/p5e_direct_ssm_transplant_cli.py
          grep -q 'embedding_energy_coordinate_selection' src/vn97/p5e_direct_ssm_transplant_cli.py
          grep -q 'DIRECT_SSM_TRANSPLANT_READY_FOR_CALIBRATION' src/vn97/p5e_direct_ssm_transplant_cli.py
          grep -q 'p5e-direct-transplant' pyproject.toml
          grep -q -- '--blend 0.35' tools/kaggle_p5e_direct_ssm_transplant.sh
