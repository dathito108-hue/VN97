name: P5E4G temporary validation

on:
  push:
    branches:
      - p5e4g-prefix-decoding-repair

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile src/vn97/p5e4g_prefix_decoding_repair_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5e4g_repair.sh
      - name: P5E4G contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("src/vn97/p5e4g_prefix_decoding_repair_cli.py").read_text()
          pyproject = Path("pyproject.toml").read_text()
          launcher = Path("tools/kaggle_p5e4g_repair.sh").read_text()
          required = [
              "PREFIX_DECODING_REPAIR_SIGNAL",
              "ready_for_decoding_repair",
              "FIRST_TOKEN_WEIGHT = 8.0",
              "EARLY_4_WEIGHT = 4.0",
              "EARLY_16_WEIGHT = 2.0",
              "_state_hash(model, exclude_final_norm=False)",
              '"ready_for_qat": False',
              "parent_adapter_sha256",
          ]
          missing = [item for item in required if item not in src]
          assert not missing, missing
          assert 'vn97-p5e4g-repair = "vn97.p5e4g_prefix_decoding_repair_cli:main"' in pyproject
          assert "python -m vn97.p5e4g_prefix_decoding_repair_cli" in launcher
          PY
