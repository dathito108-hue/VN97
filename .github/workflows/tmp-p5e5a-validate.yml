name: P5E5A temporary validation

on:
  push:
    branches:
      - p5e5a-late-core-sequence-repair

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile src/vn97/p5e5a_late_core_sequence_repair_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5e5a_repair.sh
      - name: P5E5A contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("src/vn97/p5e5a_late_core_sequence_repair_cli.py").read_text()
          pyproject = Path("pyproject.toml").read_text()
          launcher = Path("tools/kaggle_p5e5a_repair.sh").read_text()
          required = [
              "TRAINABLE_LAYERS = 4",
              "TRAIN_START_LAYER = 28",
              "ADAPTER_RANK = 96",
              "LATE_CORE_RESCUE_SIGNAL",
              "MIN_QAT_EXACT_RATE = 0.10",
              "MIN_EXACT_GAIN = 8",
              "frozen first-28-layer prefix changed",
              "ready_for_qat",
              "best-late-core.pt",
              "SEQUENCE_RESCUE_INSUFFICIENT",
          ]
          missing = [item for item in required if item not in src]
          assert not missing, missing
          assert 'vn97-p5e5a-repair = "vn97.p5e5a_late_core_sequence_repair_cli:main"' in pyproject
          assert "python -m vn97.p5e5a_late_core_sequence_repair_cli" in launcher
          PY
