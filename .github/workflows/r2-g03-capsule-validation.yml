name: VN97 R2-G0.3 Capsule Validation

on:
  push:
    branches:
      - r2-g03-zero-copy-real-capsule

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             "torch>=2.2,<3"
          python -m pip install --disable-pip-version-check "pytest>=8"
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             src/vn97/r2/mamba2_g03_capsule.py             src/vn97/r2/mamba2_g03_capsule_cli.py
          bash -n tools/r2_g02_fetch_mamba2.sh
          bash -n tools/r2_g03_real_capsule_campaign.sh

      - name: Run Mamba2 G0 through G0.3 regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_r2_mamba2_transfer.py             tests/test_r2_mamba2_g02.py             tests/test_r2_mamba2_g03_capsule.py

      - name: Validate manual real-workflow YAML is dispatch-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/r2-g03-real-mamba2-capsule.yml").read_text()
          assert "workflow_dispatch:" in text
          assert "RUN_REAL_MAMBA2_G03_TRANSFER" in text
          assert "I_ACKNOWLEDGE_APACHE2_MAMBA2_GPTNEOX" in text
          assert "branches:" not in text
          PY
