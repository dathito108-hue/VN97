name: R2-D11 targeted validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/vn97/r2/production_registry.py"
      - "src/vn97/r2/production_registry_cli.py"
      - "src/vn97/r2/production_source_adapter.py"
      - "src/vn97/r2/production_acquisition.py"
      - "src/vn97/r2/production_corpus_scale.py"
      - "src/vn97/r2/__init__.py"
      - "tests/test_r2_production_registry.py"
      - "tests/test_r2_production_source_adapter.py"
      - "tests/test_r2_production_acquisition.py"
      - "tests/test_r2_production_corpus_scale.py"
      - "pyproject.toml"
      - ".github/workflows/r2d11-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile R2-D11 modules
        run: python -m py_compile src/vn97/r2/production_registry.py src/vn97/r2/production_registry_cli.py src/vn97/r2/production_source_adapter.py src/vn97/r2/production_acquisition.py src/vn97/r2/production_corpus_scale.py src/vn97/r2/__init__.py
      - name: Run R2-D11 targeted tests
        run: pytest -q tests/test_r2_production_registry.py tests/test_r2_production_source_adapter.py tests/test_r2_production_acquisition.py tests/test_r2_production_corpus_scale.py
