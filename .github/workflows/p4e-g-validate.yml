name: VN97 P4E-G Validate

on:
  push:
    branches:
      - p4e-g-compositional-generalization-repair

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q \
            src/vn97/p4_compositional_repair_curriculum.py \
            src/vn97/p4_compositional_repair_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p4e_compositional_repair.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p4e-compositional-repair"] == "vn97.p4_compositional_repair_cli:main"
          PY

      - name: Canonical repair contract markers
        run: |
          grep -q 'generate_chat_completion' src/vn97/p4_compositional_repair_cli.py
          grep -q 'P4E_G_COUNTS' src/vn97/p4_compositional_repair_curriculum.py
          grep -q '"reasoning_planning": 1400' src/vn97/p4_compositional_repair_curriculum.py
          grep -q 'REJECTED_REASONING_FLOOR' src/vn97/p4_compositional_repair_cli.py
          grep -q 'REJECTED_STRONG_CATEGORY_REGRESSION' src/vn97/p4_compositional_repair_cli.py
