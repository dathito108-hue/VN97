name: VN97 P4E-N Sequential Validate

on:
  push:
    branches:
      - p4e-n-low-memory-sequential-scan

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q             src/vn97/model.py             src/vn97/p4_sequence_ranking_repair_cli.py

      - name: Sequential execution contract
        run: |
          grep -q 'def forward_hidden_embeddings_sequential_reference' src/vn97/model.py
          grep -q 'layer.core.forward_sequential_reference' src/vn97/model.py
          grep -q 'def forward_sequential_reference' src/vn97/model.py
          grep -q 'model.forward_sequential_reference' src/vn97/p4_sequence_ranking_repair_cli.py
          grep -q 'memory_safe_detached_negative_v1' src/vn97/p4_sequence_ranking_repair_cli.py
          grep -q 'state.p4en.pt' src/vn97/p4_sequence_ranking_repair_cli.py

      - name: Production parallel path preserved
        run: |
          grep -q 'hidden, new_states = self.forward_hidden(' src/vn97/model.py
          grep -q 'return self.lm_head(hidden), new_states' src/vn97/model.py
