name: VN97 R2-K2G B Path Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/vn97/r2/mamba2_kaggle_k2g_b_path.py"
      - "tools/kaggle_r2_k2g_b_path.sh"
      - "tests/test_r2_mamba2_k2g_b_path.py"
      - "docs/VN97_R2_K2G_B_PATH.md"
      - ".github/workflows/r2-k2g-b-path-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             "torch==2.10.0"
          python -m pip install --disable-pip-version-check numpy pytest
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/kaggle_r2_k2g_b_path.sh
          python -m py_compile src/vn97/r2/mamba2_kaggle_k2g_b_path.py

      - name: K2G tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q             tests/test_r2_mamba2_k2g_b_path.py             tests/test_r2_mamba2_k2f_dbx_operands.py             tests/test_r2_mamba2_g04_onnx.py

      - name: Verify diagnostic-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"weights_changed": False'             src/vn97/r2/mamba2_kaggle_k2g_b_path.py
          grep -F '"architecture_changed": False'             src/vn97/r2/mamba2_kaggle_k2g_b_path.py
          grep -F '"acceptance_threshold_defined": False'             src/vn97/r2/mamba2_kaggle_k2g_b_path.py
          grep -F '"production_activation_authorized": False'             src/vn97/r2/mamba2_kaggle_k2g_b_path.py
