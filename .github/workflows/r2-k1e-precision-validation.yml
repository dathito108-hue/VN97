name: VN97 K1E Precision Validation

on:
  push:
    branches:
      - r2-k1e-match-official-fallback-precision

permissions:
  contents: read

concurrency:
  group: vn97-k1e-precision
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch and pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             "torch>=2.2,<3"
          python -m pip install --disable-pip-version-check "pytest>=8"
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Run Mamba2 reference regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_r2_mamba2_g02.py
