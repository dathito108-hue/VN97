name: VN97 R2-K2O Holdout Gate Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/vn97/r2/mamba2_kaggle_k2o_holdout_gate.py"
      - "tools/kaggle_r2_k2o_holdout_gate.sh"
      - "tests/test_r2_mamba2_k2o_holdout_gate.py"
      - "docs/VN97_R2_K2O_HOLDOUT_GATE.md"
      - ".github/workflows/r2-k2o-holdout-gate-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             "torch==2.10.0"
          python -m pip install --disable-pip-version-check numpy pytest
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/kaggle_r2_k2o_holdout_gate.sh
          python -m py_compile src/vn97/r2/mamba2_kaggle_k2o_holdout_gate.py

      - name: K2O tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q             tests/test_r2_mamba2_k2o_holdout_gate.py             tests/test_r2_mamba2_k2n_ulp_audit.py             tests/test_r2_mamba2_g04_onnx.py

      - name: Verify holdout gate boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"predeclared_before_holdout_measurement": True'             src/vn97/r2/mamba2_kaggle_k2o_holdout_gate.py
          grep -F '"acceptance_threshold_defined": True'             src/vn97/r2/mamba2_kaggle_k2o_holdout_gate.py
          grep -F '"production_graph_changed": False'             src/vn97/r2/mamba2_kaggle_k2o_holdout_gate.py
          grep -F '"production_activation_authorized": False'             src/vn97/r2/mamba2_kaggle_k2o_holdout_gate.py
