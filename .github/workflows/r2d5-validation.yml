name: R2-D5 targeted validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/vn97/r2/production_campaign.py"
      - "src/vn97/r2/production_campaign_cli.py"
      - "src/vn97/r2/production_launcher.py"
      - "src/vn97/r2/production_training.py"
      - "src/vn97/r2/production_contract.py"
      - "src/vn97/r2/__init__.py"
      - "tests/test_r2_production_campaign.py"
      - "tests/test_r2_production_launcher.py"
      - "tests/test_r2_production_training.py"
      - "tests/test_r2_production_contract.py"
      - "pyproject.toml"
      - ".github/workflows/r2d5-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile R2-D5 modules
        run: python -m py_compile src/vn97/r2/production_campaign.py src/vn97/r2/production_campaign_cli.py src/vn97/r2/production_launcher.py src/vn97/r2/production_training.py src/vn97/r2/production_contract.py src/vn97/r2/__init__.py
      - name: Run R2-D5 targeted tests
        run: pytest -q tests/test_r2_production_campaign.py tests/test_r2_production_launcher.py tests/test_r2_production_training.py tests/test_r2_production_contract.py
