name: P5E4J temporary validation

on:
  push:
    branches:
      - p5e4j-autoregressive-parity-diagnostic

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile src/vn97/p5e4j_autoregressive_parity_diagnostic_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5e4j_diagnose.sh
      - name: P5E4J contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("src/vn97/p5e4j_autoregressive_parity_diagnostic_cli.py").read_text()
          pyproject = Path("pyproject.toml").read_text()
          launcher = Path("tools/kaggle_p5e4j_diagnose.sh").read_text()
          required = [
              "RUNTIME_PARITY_GAP",
              "DECODING_CONSTRAINT_INTERFERENCE",
              "FIRST_TOKEN_DECISION_GAP",
              "EARLY_PREFIX_DECISION_GAP",
              "DISTRIBUTED_SEQUENCE_DECISION_GAP",
              "forward_sequential_reference",
              "runtime_prod_lost_correct",
              "constraint_flip_prod",
              "ready_for_qat",
          ]
          missing = [item for item in required if item not in src]
          assert not missing, missing
          assert 'vn97-p5e4j-diagnose = "vn97.p5e4j_autoregressive_parity_diagnostic_cli:main"' in pyproject
          assert "python -m vn97.p5e4j_autoregressive_parity_diagnostic_cli" in launcher
          PY
