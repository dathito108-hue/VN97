name: VN97 P5B Validate

on:
  push:
    branches:
      - p5b-mamba-intelligence-transplant

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q             src/vn97/p5b_mamba_transplant.py             src/vn97/p5b_mamba_transplant_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p5b_mamba_transplant.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p5b-mamba-transplant"] == "vn97.p5b_mamba_transplant_cli:main"
          PY

      - name: Frozen source contract
        run: |
          grep -q 'state-spaces/mamba-130m-hf' src/vn97/p5b_mamba_transplant.py
          grep -q 'SOURCE_HIDDEN = 768' src/vn97/p5b_mamba_transplant.py
          grep -q 'SOURCE_INNER = 1536' src/vn97/p5b_mamba_transplant.py
          grep -q 'SOURCE_LAYERS = 24' src/vn97/p5b_mamba_transplant.py
          grep -q 'SOURCE_STATE = 16' src/vn97/p5b_mamba_transplant.py
          grep -q 'SOURCE_DT_RANK = 48' src/vn97/p5b_mamba_transplant.py

      - name: Native transplant contract
        run: |
          grep -q 'layer_mapping' src/vn97/p5b_mamba_transplant_cli.py
          grep -q 'snap_ternary_parameter' src/vn97/p5b_mamba_transplant.py
          grep -q 'torch.linalg.svd' src/vn97/p5b_mamba_transplant_cli.py
          grep -q 'save_deployment_checkpoint' src/vn97/p5b_mamba_transplant_cli.py
          grep -q 'build_model_image' src/vn97/p5b_mamba_transplant_cli.py
          grep -q 'TRANSPLANT_READY_FOR_ALIGNMENT' src/vn97/p5b_mamba_transplant_cli.py
          grep -q 'STRUCTURALLY_FEASIBLE' src/vn97/p5b_mamba_transplant_cli.py
