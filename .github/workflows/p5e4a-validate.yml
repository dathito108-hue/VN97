name: VN97 P5E4A Validate

on:
  push:
    branches:
      - p5e4a-selective-delta-reblend

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall -q src/vn97/p5e4a_selective_reblend_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5e4a_reblend.sh
      - name: Reblend contract
        run: |
          grep -q 'teacher_loaded=false' tools/kaggle_p5e4a_reblend.sh
          grep -q 'SAFE_REBLEND_GAIN' src/vn97/p5e4a_selective_reblend_cli.py
          grep -q 'fresh_holdout_required' src/vn97/p5e4a_selective_reblend_cli.py
          grep -q 'p5e4a-reblend' pyproject.toml
