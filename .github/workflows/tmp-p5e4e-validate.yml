name: P5E4E temporary validation

on:
  push:
    branches:
      - p5e4e-output-residual-expansion

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile src/vn97/p5e4e_output_expansion_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5e4e_expand.sh
      - name: P5E4E contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("src/vn97/p5e4e_output_expansion_cli.py").read_text()
          pyproject = Path("pyproject.toml").read_text()
          launcher = Path("tools/kaggle_p5e4e_expand.sh").read_text()
          required = [
              'ready_for_output_expansion") is not True',
              'parameter.requires_grad_(False)',
              'OUTPUT_EXPANSION_SIGNAL',
              '"ready_for_qat": False',
              'adapter_state_dict',
              '_state_hash(model, exclude_final_norm=False)',
          ]
          missing = [item for item in required if item not in src]
          assert not missing, missing
          assert 'vn97-p5e4e-expand = "vn97.p5e4e_output_expansion_cli:main"' in pyproject
          assert "python -m vn97.p5e4e_output_expansion_cli" in launcher
          PY
