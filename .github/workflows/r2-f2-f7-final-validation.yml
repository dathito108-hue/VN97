name: VN97 R2 F2-F7 Final Validation

on:
  push:
    branches:
      - r2-f2-f7-turnkey-integration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: R2 F2-F7 static truth gate
        run: python3 tools/r2_f7_static_gate.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install pinned Android packages
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          TOOLS_ZIP="$RUNNER_TEMP/android-cmdline-tools.zip"
          TOOLS_DIR="$RUNNER_TEMP/android-cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" -o "$TOOLS_ZIP"
          rm -rf "$TOOLS_DIR"
          mkdir -p "$TOOLS_DIR"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
          SDKMANAGER="$TOOLS_DIR/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --channel=3             "platforms;android-37.0" "build-tools;36.0.0"             "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Compile and build debug APK
        run: |
          gradle -p android --no-daemon --stacktrace :app:assembleDebug
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: VN97-R2-F2-F7-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
