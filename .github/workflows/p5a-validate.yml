name: VN97 P5A Validate

on:
  push:
    branches:
      - p5a-scaled-foundation-pilot

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q             src/vn97/p5_scaled_foundation.py             src/vn97/p5_scaled_foundation_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p5a_scaled_foundation.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p5a-scaled-foundation"] == "vn97.p5_scaled_foundation_cli:main"
          PY

      - name: Scale ladder contract
        run: |
          grep -q 'd_model=576' src/vn97/p5_scaled_foundation.py
          grep -q 'n_layers=18' src/vn97/p5_scaled_foundation.py
          grep -q 'd_model=672' src/vn97/p5_scaled_foundation.py
          grep -q 'd_model=768' src/vn97/p5_scaled_foundation.py
          grep -q 'MAX_TRAIN_WINDOWS = 6000' src/vn97/p5_scaled_foundation.py

      - name: T4 memory contract
        run: |
          grep -q 'forward_sequential_reference' src/vn97/p5_scaled_foundation_cli.py
          grep -q 'torch.float16' src/vn97/p5_scaled_foundation_cli.py
          grep -q 'GradScaler' src/vn97/p5_scaled_foundation_cli.py
          grep -q 'LOGICAL_BATCH_SIZE' src/vn97/p5_scaled_foundation_cli.py
          grep -q 'expandable_segments:True' tools/kaggle_p5a_scaled_foundation.sh

      - name: Held-out contract
        run: |
          grep -q 'held_out_expressions' src/vn97/p5_scaled_foundation_cli.py
          grep -q 'held_out_prompts' src/vn97/p5_scaled_foundation_cli.py
          grep -q 'reasoning_planning' src/vn97/p5_scaled_foundation_cli.py
