name: VN97 R2-G0.2 Mamba2 Real Transfer Parity Validation

on:
  push:
    branches:
      - r2-g02-mamba2-real-transfer-parity

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             "torch>=2.2,<3"
          python -m pip install --disable-pip-version-check "pytest>=8"
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Static syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             src/vn97/r2/mamba2_transfer.py             src/vn97/r2/mamba2_transfer_cli.py             src/vn97/r2/mamba2_source_integrity.py             src/vn97/r2/mamba2_ssd_reference.py             src/vn97/r2/mamba2_parity.py             src/vn97/r2/mamba2_parity_cli.py
          bash -n tools/r2_g02_fetch_mamba2.sh

      - name: Run G0 G1 G0.2 regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_r2_mamba2_transfer.py             tests/test_r2_mamba2_g02.py

      - name: Exercise pinned config-only assess
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mamba2-source"
          mkdir -p "$ROOT"
          cat > "$ROOT/config.json" <<'JSON'
          {
            "d_model": 2560,
            "d_intermediate": 0,
            "n_layer": 64,
            "vocab_size": 50277,
            "ssm_cfg": {"layer": "Mamba2"},
            "attn_layer_idx": [],
            "attn_cfg": {},
            "rms_norm": true,
            "residual_in_fp32": true,
            "fused_add_norm": true,
            "pad_vocab_size_multiple": 16,
            "tie_embeddings": true
          }
          JSON
          vn97-r2-mamba2-transfer assess --source-root "$ROOT"

      - name: Exercise parity receipt CLI with synthetic exact traces
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/parity"
          mkdir -p "$ROOT"
          PARITY_ROOT="$ROOT" python - <<'PY'
          import json
          import os
          import torch
          from pathlib import Path
          root = Path(os.environ["PARITY_ROOT"])
          trace = {
              "layer0.hidden": torch.tensor([[1.0, 2.0]]),
              "layer0.conv_state": torch.tensor([[[1.0, 2.0]]]),
              "layer0.ssm_state": torch.tensor([[[[3.0, 4.0]]]]),
              "final.logits": torch.tensor([[0.1, 0.2, 0.3]]),
          }
          torch.save(trace, root / "source.pt")
          torch.save(trace, root / "vn97.pt")
          (root / "probe.json").write_text(json.dumps([1, 2, 3]))
          (root / "source-generated.json").write_text(json.dumps([4, 5, 6]))
          (root / "vn97-generated.json").write_text(json.dumps([4, 5, 6]))
          PY
          vn97-r2-mamba2-parity             --source-trace "$ROOT/source.pt"             --vn97-trace "$ROOT/vn97.pt"             --token-probe "$ROOT/probe.json"             --source-generated "$ROOT/source-generated.json"             --vn97-generated "$ROOT/vn97-generated.json"             --source-weight-sha256 254d89bfef6dd9f44c8e3f54e0730af3f10c482969117cb37fb33486348b00be             --vn97-checkpoint-sha256 bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb             --output "$ROOT/parity.json"
          test -s "$ROOT/parity.json"
