name: VN97 P5D4A Cache Miss Validate

on:
  push:
    branches:
      - p5d4a-cache-miss-config-repair

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n tools/kaggle_p5d4a_teacher_expansion.sh
      - name: Cache-miss repair contract
        run: |
          grep -q 'LocalEntryNotFoundError' tools/kaggle_p5d4a_teacher_expansion.sh
          grep -q 'CACHE CONFIG missing; downloading only config.json' tools/kaggle_p5d4a_teacher_expansion.sh
          grep -q 'local_files_only=False' tools/kaggle_p5d4a_teacher_expansion.sh
          grep -q 'force_download=True' tools/kaggle_p5d4a_teacher_expansion.sh
