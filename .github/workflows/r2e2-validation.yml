name: R2-E2 targeted validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/vn97/r2/onnx_export.py"
      - "src/vn97/r2/onnx_export_cli.py"
      - "src/vn97/r2/adaptive_execution.py"
      - "src/vn97/r2/__init__.py"
      - "tests/test_r2_onnx_export.py"
      - "tests/test_r2_adaptive_execution.py"
      - "tests/test_r2_foundation.py"
      - "pyproject.toml"
      - ".github/workflows/r2e2-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package with ONNX validation runtime
        run: python -m pip install -e ".[dev,onnx]"

      - name: Compile E2 Python modules
        run: python -m py_compile src/vn97/r2/onnx_export.py src/vn97/r2/onnx_export_cli.py src/vn97/r2/__init__.py

      - name: Run E2 ONNX parity and E1 regressions
        run: pytest -q tests/test_r2_onnx_export.py tests/test_r2_adaptive_execution.py tests/test_r2_foundation.py
