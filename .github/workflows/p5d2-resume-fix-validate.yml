name: VN97 P5D2 Resume Fix Validate

on:
  push:
    branches:
      - p5d2-light-resume-checkpoints

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q             src/vn97/p5d_behavioral_distillation_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p5d2_distill.sh

      - name: Light checkpoint contract
        run: |
          grep -q 'VN97P5D2LIGHT1' src/vn97/p5d_behavioral_distillation_cli.py
          grep -q 'dtype=torch.float16' src/vn97/p5d_behavioral_distillation_cli.py
          grep -q 'optimizer_state.*reset_on_resume' src/vn97/p5d_behavioral_distillation_cli.py
          grep -q '_use_new_zipfile_serialization=False' src/vn97/p5d_behavioral_distillation_cli.py
          grep -q 'os.fsync' src/vn97/p5d_behavioral_distillation_cli.py
          grep -q 'CHECKPOINT_INTERVAL_STEPS // 2' src/vn97/p5d_behavioral_distillation_cli.py
          grep -q 'state.p5d2.pt.tmp' tools/kaggle_p5d2_distill.sh
