name: VN97 P5D3A HF Pin Validate

on:
  push:
    branches:
      - p5d3a-tokenizer-compat-pin

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n tools/kaggle_p5d3a_teacher_features.sh
          bash -n tools/kaggle_p5d1_teacher_corpus.sh
      - name: Compatibility pin contract
        run: |
          grep -q '"transformers==4.46.1"' tools/kaggle_p5d3a_teacher_features.sh
          grep -q '"tokenizers==0.20.3"' tools/kaggle_p5d3a_teacher_features.sh
          grep -q '"transformers==4.46.1"' tools/kaggle_p5d1_teacher_corpus.sh
          grep -q '"tokenizers==0.20.3"' tools/kaggle_p5d1_teacher_corpus.sh
          grep -q 'P5D3A HF STACK' tools/kaggle_p5d3a_teacher_features.sh
