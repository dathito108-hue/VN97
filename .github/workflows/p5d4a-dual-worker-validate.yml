name: VN97 P5D4A Dual Worker Validate

on:
  push:
    branches:
      - p5d4a-dual-t4-int8-teacher-workers

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall -q src/vn97/p5d_teacher_corpus_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5d4a_teacher_expansion.sh
      - name: Worker contract
        run: |
          grep -q -- '--teacher-int8' src/vn97/p5d_teacher_corpus_cli.py
          grep -q -- '--worker-count' src/vn97/p5d_teacher_corpus_cli.py
          grep -q -- '--finalize-only' src/vn97/p5d_teacher_corpus_cli.py
          grep -q 'bitsandbytes==0.48.1' tools/kaggle_p5d4a_teacher_expansion.sh
          grep -q 'CUDA_VISIBLE_DEVICES=0' tools/kaggle_p5d4a_teacher_expansion.sh
          grep -q 'CUDA_VISIBLE_DEVICES=1' tools/kaggle_p5d4a_teacher_expansion.sh
          grep -q 'mode=dual_t4_llm_int8' tools/kaggle_p5d4a_teacher_expansion.sh
