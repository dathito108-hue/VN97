name: VN97 R2-K2F Operand Isolation Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/vn97/r2/mamba2_onnx.py"
      - "src/vn97/r2/mamba2_kaggle_k2d_stage_trace.py"
      - "src/vn97/r2/mamba2_kaggle_k2f_dbx_operands.py"
      - "tools/kaggle_r2_k2f_dbx_operands.sh"
      - "tests/test_r2_mamba2_k2f_dbx_operands.py"
      - "docs/VN97_R2_K2F_DBX_OPERANDS.md"
      - ".github/workflows/r2-k2f-operand-isolation-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             "torch==2.10.0"
          python -m pip install --disable-pip-version-check numpy pytest
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/kaggle_r2_k2f_dbx_operands.sh
          python -m py_compile             src/vn97/r2/mamba2_onnx.py             src/vn97/r2/mamba2_kaggle_k2d_stage_trace.py             src/vn97/r2/mamba2_kaggle_k2f_dbx_operands.py

      - name: K2F micrograph tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q             tests/test_r2_mamba2_k2f_dbx_operands.py             tests/test_r2_mamba2_k2d_stage_trace.py             tests/test_r2_mamba2_g04_onnx.py

      - name: Verify canonical dBx and diagnostic-only boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'd_b_x = torch.einsum(' src/vn97/r2/mamba2_onnx.py
          grep -F '"acceptance_threshold_defined": False'             src/vn97/r2/mamba2_kaggle_k2f_dbx_operands.py
          grep -F '"production_activation_authorized": False'             src/vn97/r2/mamba2_kaggle_k2f_dbx_operands.py
