name: VN97 P4E-N Validate

on:
  push:
    branches:
      - p4e-n-sequence-ranking-repair

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m compileall -q \
            src/vn97/p4_sequence_ranking_curriculum.py \
            src/vn97/p4_sequence_ranking_repair_cli.py

      - name: Shell syntax
        run: bash -n tools/kaggle_p4e_sequence_ranking_repair.sh

      - name: Entrypoint contract
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          assert data["project"]["scripts"]["vn97-p4e-sequence-ranking-repair"] == "vn97.p4_sequence_ranking_repair_cli:main"
          PY

      - name: Ranking objective contract
        run: |
          grep -q 'ranking_margin' src/vn97/p4_sequence_ranking_repair_cli.py
          grep -q 'F.softplus' src/vn97/p4_sequence_ranking_repair_cli.py
          grep -q 'preserve_weight' src/vn97/p4_sequence_ranking_repair_cli.py
          grep -q 'hard_negative' src/vn97/p4_sequence_ranking_curriculum.py
          grep -q 'min-reasoning-passes' src/vn97/p4_sequence_ranking_repair_cli.py
          grep -q 'state.p4en.pt' src/vn97/p4_sequence_ranking_repair_cli.py
