name: VN97 M20B Revenue Campaign

on:
  push:
    branches:
      - m20b-revenue-campaign
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/m20b-revenue-campaign.yml"
      - "android/app/**"
      - "android/avatar/**"
      - "android/platform/**"
      - "android/runtime/**"
      - "native/src/runtime.cpp"
      - "native/include/vn97/runtime.h"
      - "native/tests/external_identity_test.cpp"
      - "tests/host_g06_app_route.py"
      - "tests/data/g08_descriptor_identity.json"
      - "tests/data/g08_canonical_vectors.json"
      - "tests/host_g06_deployment_preflight.py"
      - "tools/g06_deployment_preflight.py"
      - "src/vn97/r2/mamba2_android_runtime.py"
      - "src/vn97/r2/mamba2_bundle_contract.py"
      - "src/vn97/r2/mamba2_cognition_bridge.py"
      - "src/vn97/r2/mamba2_promotion.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m20b-revenue-campaign-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android compile SDK
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Verify G06 route and planner-only continuity
        shell: bash
        run: |
          python3 tests/host_g06_app_route.py
          python3 tests/host_mamba2_runtime_contract.py
          python3 tests/host_g06_deployment_preflight.py
          for test in external_identity_test runtime_test; do
            g++ -std=c++17 -O1 -pthread -I native/include "native/tests/$test.cpp" native/src/runtime.cpp native/src/language.cpp native/src/packed_ternary.cpp native/src/recurrent.cpp native/src/selective.cpp -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
          done

      - name: Verify G08 identity with Android and JVM JSON implementations
        shell: bash
        run: |
          curl --fail --location --retry 2 https://repo.maven.apache.org/maven2/com/vaadin/external/google/android-json/0.0.20131108.vaadin1/android-json-0.0.20131108.vaadin1.jar -o "$RUNNER_TEMP/android-json.jar"
          curl --fail --location --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/jvm-json.jar"
          kotlinc android/runtime/src/main/java/ai/vn97/runtime/Mamba2GptNeoXTokenizer.kt android/runtime/host-test/G08CanonicalIdentityTest.kt -cp "$RUNNER_TEMP/jvm-json.jar" -Werror -include-runtime -d "$RUNNER_TEMP/g08-identity.jar"
          for json_impl in android-json jvm-json; do
            java -cp "$RUNNER_TEMP/g08-identity.jar:$RUNNER_TEMP/$json_impl.jar" ai.vn97.runtime.G08CanonicalIdentityTestKt tests/data/g08_descriptor_identity.json tests/data/g08_canonical_vectors.json
          done

      - name: Verify bundled experimental decode graph
        run: |
          python3 - <<'PYCODE'
          import gzip, hashlib
          from pathlib import Path
          graph = gzip.decompress(Path('android/app/src/main/assets/vn97-int8-decode.onnx.gz').read_bytes())
          assert len(graph) == 4906371
          assert hashlib.sha256(graph).hexdigest() == '873c862d50cfe7c10b47b5c02e11fc8dea42ad381431570e657a0eba99bdd88e'
          PYCODE

      - name: Compile debug APK
        shell: bash
        run: |
          gradle -p android --no-daemon --stacktrace :app:assembleDebug

      - name: Verify canonical assistant session lifecycle
        shell: bash
        run: |
          gradle -p android --no-daemon --stacktrace :platform:testDebugUnitTest :app:testDebugUnitTest

      - name: Run host contracts
        shell: bash
        run: |
          command -v kotlinc
          bash android/app/host-test/run.sh

      - name: Prepare verified debug artifact
        shell: bash
        run: |
          mkdir -p android/app/build/verified-debug
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/verified-debug/
          cp docs/mobile-debug-artifacts.md android/app/build/verified-debug/README.md
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path("android/app/build/verified-debug")
          metadata = {
              "schema": "VN97_DEBUG_BUILD_1",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_ref": os.environ["GITHUB_REF"],
              "workflow_run": os.environ["GITHUB_RUN_ID"],
              "workflow_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "variant": "debug",
              "host_contracts": "passed",
              "device_tested": False,
              "production_ready": False,
          }
          (out / "build.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          PY
          cd android/app/build/verified-debug
          sha256sum app-debug.apk build.json README.md > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VN97-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/verified-debug/
          if-no-files-found: error
          retention-days: 7
