name: VN97 M20B Revenue Campaign

on:
  push:
    branches:
      - m20b-revenue-campaign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android compile SDK
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Compile debug APK
        shell: bash
        run: |
          gradle -p android --no-daemon --stacktrace :app:assembleDebug

      - name: Run host contracts
        shell: bash
        run: |
          if command -v kotlinc >/dev/null 2>&1; then
            bash android/app/host-test/run.sh
          else
            echo "kotlinc not present; Android Kotlin compilation already passed."
          fi
