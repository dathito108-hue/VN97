name: VN97 M20B Revenue Campaign

on:
  push:
    branches:
      - m20b-revenue-campaign
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/m20b-revenue-campaign.yml"
      - "android/app/**"
      - "android/platform/**"
      - "android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtExecutor.kt"
      - "android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtExecutionBuffers.kt"
      - "android/runtime/src/main/java/ai/vn97/runtime/Mamba2OrtTensorStorage.kt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m20b-revenue-campaign-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android compile SDK
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Compile debug APK
        shell: bash
        run: |
          gradle -p android --no-daemon --stacktrace :app:assembleDebug

      - name: Verify canonical assistant session lifecycle
        shell: bash
        run: |
          gradle -p android --no-daemon --stacktrace :platform:testDebugUnitTest :app:testDebugUnitTest

      - name: Run host contracts
        shell: bash
        run: |
          command -v kotlinc
          bash android/app/host-test/run.sh

      - name: Prepare verified debug artifact
        shell: bash
        run: |
          mkdir -p android/app/build/verified-debug
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/verified-debug/
          cp docs/mobile-debug-artifacts.md android/app/build/verified-debug/README.md
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path("android/app/build/verified-debug")
          metadata = {
              "schema": "VN97_DEBUG_BUILD_1",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_ref": os.environ["GITHUB_REF"],
              "workflow_run": os.environ["GITHUB_RUN_ID"],
              "workflow_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "variant": "debug",
              "host_contracts": "passed",
              "device_tested": False,
              "production_ready": False,
          }
          (out / "build.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          PY
          cd android/app/build/verified-debug
          sha256sum app-debug.apk build.json README.md > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VN97-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/app/build/verified-debug/
          if-no-files-found: error
          retention-days: 7
