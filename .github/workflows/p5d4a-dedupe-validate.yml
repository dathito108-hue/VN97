name: VN97 P5D4A Dedupe Validate

on:
  push:
    branches:
      - p5d4a-dedupe-p3-manifest

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall -q src/vn97/p5d_teacher_corpus_cli.py
      - name: Stable-id dedupe contract
        run: |
          grep -q 'seen_record_ids: set\[str\] = set()' src/vn97/p5d_teacher_corpus_cli.py
          grep -q 'if record_id in seen_record_ids:' src/vn97/p5d_teacher_corpus_cli.py
          grep -q 'not enough unique eligible P3 teacher prompts' src/vn97/p5d_teacher_corpus_cli.py
