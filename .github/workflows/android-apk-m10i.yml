name: VN97 Android APK M10I

on:
  push:
    branches:
      - m10i-reproducible-apk-cold-start
      - m10j-turnkey-bootstrap
      - m19a-release-turnkey-production-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run M18 and M19A host contracts
        shell: bash
        run: |
          if command -v kotlinc >/dev/null 2>&1; then
            bash android/app/host-test/run-m18a.sh
            bash android/app/host-test/run-m18b.sh
            bash android/platform/host-test/run-m18c.sh
            bash android/app/host-test/run-m19a.sh
          else
            echo "kotlinc unavailable on runner; APK compilation remains the integration gate."
          fi

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install pinned Android packages
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          TOOLS_ZIP="$RUNNER_TEMP/android-cmdline-tools.zip"
          TOOLS_DIR="$RUNNER_TEMP/android-cmdline-tools"
          curl -fsSL             "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"             -o "$TOOLS_ZIP"
          rm -rf "$TOOLS_DIR"
          mkdir -p "$TOOLS_DIR"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
          SDKMANAGER="$TOOLS_DIR/cmdline-tools/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER"             --sdk_root="$ANDROID_SDK_ROOT"             --channel=3             "platforms;android-37.0"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Assert production release gate fails closed without release inputs
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/m19a-release-gate.log"
          set +e
          gradle -p android \
            --no-daemon \
            --stacktrace \
            --continue \
            :app:verifyTurnkeyBootstrap \
            :app:verifyReleaseSigning \
            :app:verifyReleaseVersion \
            >"$LOG" 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            cat "$LOG"
            echo "M19A production gate unexpectedly passed without production inputs." >&2
            exit 1
          fi
          grep -q "VN97 turnkey release requires a safe regular asset" "$LOG"
          grep -q "VN97 release signing requires" "$LOG"
          echo "M19A_RELEASE_GATE_FAIL_CLOSED_PASS"

      - name: Build VN97 debug APK
        shell: bash
        run: |
          gradle -p android             --no-daemon             --stacktrace             :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VN97-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
