name: VN97 P2 medium pilot profile

on:
  push:
    branches:
      - p2-medium-cpu-pilot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate P2 profile
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("configs/p2-medium-pilot.vn97campdef1.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          assert set(x) == {"schema", "candidates"}
          assert x["schema"] == "VN97CAMPDEF1"
          assert len(x["candidates"]) == 1
          c = x["candidates"][0]
          assert c == {
              "d_model": 192,
              "d_state": 16,
              "embedding_rank": 96,
              "learning_rate": 0.0003,
              "n_layers": 6,
              "seed": 97,
          }
          assert Path("docs/P2_MEDIUM_CPU_PILOT.md").is_file()
          text = Path("docs/PRODUCTION_INTELLIGENCE_CLOSURE_V1.md").read_text(encoding="utf-8")
          assert "## P2 — Medium CPU-first pilot" in text
          print("VN97 P2 medium pilot profile PASS")
          PY
