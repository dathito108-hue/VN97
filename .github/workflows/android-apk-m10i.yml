name: VN97 Android APK M10I

on:
  push:
    branches:
      - m10i-reproducible-apk-cold-start
      - m10j-turnkey-bootstrap
      - m19c-signed-release-candidate-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate M19C signed candidate contracts
        shell: bash
        run: |
          python -m compileall -q             src/vn97/release_candidate.py             src/vn97/bootstrap_release_cli.py             tests/host_m19b_release_candidate.py             tests/host_m19c_signed_candidate.py             tests/test_bootstrap_release_cli.py
          python tests/host_m19b_release_candidate.py
          python tests/host_m19c_signed_candidate.py
          if python - <<'PY'
          import importlib.util
          names = ("torch", "pytest", "cryptography")
          missing = [name for name in names if importlib.util.find_spec(name) is None]
          raise SystemExit(0 if not missing else 1)
          PY
          then
            PYTHONPATH=src python -m pytest -q tests/test_bootstrap_release_cli.py
          else
            echo "Torch/pytest/cryptography not all preinstalled; skipping heavy M10N integration test."
          fi

      - name: Set up JDK 17
        if: github.ref_name != 'm19c-signed-release-candidate-bridge'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        if: github.ref_name != 'm19c-signed-release-candidate-bridge'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install pinned Android packages
        if: github.ref_name != 'm19c-signed-release-candidate-bridge'
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          TOOLS_ZIP="$RUNNER_TEMP/android-cmdline-tools.zip"
          TOOLS_DIR="$RUNNER_TEMP/android-cmdline-tools"
          curl -fsSL             "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip"             -o "$TOOLS_ZIP"
          rm -rf "$TOOLS_DIR"
          mkdir -p "$TOOLS_DIR"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
          SDKMANAGER="$TOOLS_DIR/cmdline-tools/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER"             --sdk_root="$ANDROID_SDK_ROOT"             --channel=3             "platforms;android-37.0"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Build VN97 debug APK
        if: github.ref_name != 'm19c-signed-release-candidate-bridge'
        shell: bash
        run: |
          gradle -p android             --no-daemon             --stacktrace             :app:assembleDebug

      - name: Verify APK
        if: github.ref_name != 'm19c-signed-release-candidate-bridge'
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        if: github.ref_name != 'm19c-signed-release-candidate-bridge'
        uses: actions/upload-artifact@v4
        with:
          name: VN97-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
