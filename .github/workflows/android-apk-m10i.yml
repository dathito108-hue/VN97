name: VN97 P4D generalization repair

on:
  push:
    branches:
      - p4d-generalization-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4d-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.2"
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Compile P4D path
        run: |
          python -m py_compile \
            src/vn97/training.py \
            src/vn97/cognition_adapter.py \
            src/vn97/p4_artifact.py \
            src/vn97/p4_generalization_curriculum.py \
            src/vn97/p4_generalization_cli.py \
            tests/host_p4_generalization.py

      - name: Run P4/P4D host tests
        run: |
          pytest -q \
            tests/host_p4_task_evaluation.py \
            tests/host_p4_core_curriculum.py \
            tests/host_p4_generalization.py

      - name: Verify P4D CLI registration
        run: |
          vn97-p4d-generalization --help >/dev/null
