name: VN97 P4B chat-aligned evaluation

on:
  push:
    branches:
      - p4b-chat-aligned-task-evaluation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4b-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.2"
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Compile P4B path
        run: |
          python -m py_compile \
            src/vn97/p4_task_evaluation.py \
            tests/host_p4_task_evaluation.py

      - name: Run P4B contract tests
        run: |
          pytest -q tests/host_p4_task_evaluation.py
