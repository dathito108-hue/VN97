name: VN97 P3 GPU isolation

on:
  push:
    branches:
      - p3-kaggle-gpu-isolation

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate dual-GPU hard isolation
        run: |
          bash -n tools/kaggle_p3_dual_gpu.sh
          grep -q 'CUDA_VISIBLE_DEVICES="$physical_gpu"' tools/kaggle_p3_dual_gpu.sh
          grep -q -- '--device cuda:0' tools/kaggle_p3_dual_gpu.sh
          grep -q 'physical cuda:1 / isolated logical cuda:0' tools/kaggle_p3_dual_gpu.sh
