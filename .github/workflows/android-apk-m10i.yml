name: VN97 P2 corpus preparation contract

on:
  push:
    branches:
      - p2-corpus-preparation-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-preparation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile torch-free P2 preparation path
        run: |
          python -m py_compile             src/vn97/corpus_io.py             src/vn97/production_corpus.py             src/vn97/production_corpus_cli.py             src/vn97/p2_corpus_intake.py             src/vn97/p2_corpus_intake_cli.py             src/vn97/p2_source_fetch.py             src/vn97/p2_source_fetch_cli.py             src/vn97/p2_corpus_bundle.py             src/vn97/p2_corpus_bundle_cli.py             tools/p2_corpus_tool.py             tests/host_production_corpus_v1.py             tests/host_p2_corpus_intake.py             tests/host_p2_source_fetch.py             tests/host_p2_corpus_bundle.py

      - name: Run P2 host contracts
        run: |
          python tests/host_production_corpus_v1.py
          python tests/host_p2_corpus_intake.py
          python tests/host_p2_source_fetch.py
          python tests/host_p2_corpus_bundle.py

      - name: Prove lightweight launcher needs no training runtime
        run: |
          python tools/p2_corpus_tool.py source-fetch --help >/dev/null
          python tools/p2_corpus_tool.py corpus-intake --help >/dev/null
          python tools/p2_corpus_tool.py corpus-seal --help >/dev/null
          python tools/p2_corpus_tool.py corpus-bundle --help >/dev/null

      - name: Validate manual workflow YAML parses
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/p2-corpus-preparation.yml"); puts "P2 workflow YAML PASS"'
