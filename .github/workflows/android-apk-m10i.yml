name: VN97 P3 resumable checkpoints

on:
  push:
    branches:
      - p3-resumable-candidate-checkpoints
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile resume path
        run: |
          python -m py_compile \
            src/vn97/p3_tensor_cache.py \
            src/vn97/p3_kaggle_cached_candidate_cli.py

      - name: Validate resume checkpoint contract
        run: |
          bash -n tools/kaggle_p3_dual_gpu.sh
          python - <<'PY'
          import ast
          from pathlib import Path

          cache = Path("src/vn97/p3_tensor_cache.py").read_text()
          cli = Path("src/vn97/p3_kaggle_cached_candidate_cli.py").read_text()
          launcher = Path("tools/kaggle_p3_dual_gpu.sh").read_text()

          tree = ast.parse(cache)
          fn = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "train_vn97_from_tensors"
          )
          kwonly = {arg.arg for arg in fn.args.kwonlyargs}
          assert "resume_checkpoint_path" in kwonly
          assert "resume_identity" in kwonly
          assert "checkpoint_interval_steps" in kwonly

          assert 'VN97P3RESUME1' in cache
          assert '_atomic_torch_save' in cache
          assert 'optimizer.state_dict()' in cache
          assert 'torch.cuda.get_rng_state' in cache
          assert 'torch.cuda.set_rng_state' in cache
          assert 'python_rng_state' in cache
          assert 'epoch_indices' in cache
          assert 'next_batch_index' in cache
          assert 'weights_only=True' in cache

          assert '--resume-dir' in cli
          assert '--checkpoint-interval-steps' in cli
          assert 'VN97P3RESUMECONTRACT1' in cli

          assert 'state.vn97p3resume1.pt' in launcher
          assert 'VN97_CHECKPOINT_INTERVAL_STEPS' in launcher
          assert '--resume-dir "$resume"' in launcher
          PY
