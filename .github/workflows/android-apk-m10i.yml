name: VN97 P2 pinned source acquisition

on:
  push:
    branches:
      - p2-pinned-source-acquisition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile P2 source acquisition
        run: |
          python -m py_compile \
            src/vn97/p2_source_fetch.py \
            src/vn97/p2_source_fetch_cli.py \
            tests/host_p2_source_fetch.py

      - name: P2 source acquisition host contract
        run: python tests/host_p2_source_fetch.py
