name: VN97 P3 failfast adaptive microbatch

on:
  push:
    branches:
      - p3-kaggle-failfast-adaptive-microbatch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate launcher syntax and adaptive defaults
        run: |
          bash -n tools/kaggle_p3_dual_gpu.sh
          grep -q 'micro_batch_for' tools/kaggle_p3_dual_gpu.sh
          grep -q '0) echo 2' tools/kaggle_p3_dual_gpu.sh
          grep -q '1|2|3) echo 1' tools/kaggle_p3_dual_gpu.sh
          grep -q 'wait -n -p first_done' tools/kaggle_p3_dual_gpu.sh
          grep -q 'candidate process failed early' tools/kaggle_p3_dual_gpu.sh
          grep -q 'kill "$p1" "$p2"' tools/kaggle_p3_dual_gpu.sh
          grep -q 'candidate $first -> physical GPU 0' tools/kaggle_p3_dual_gpu.sh
          grep -q 'candidate $second -> physical GPU 1' tools/kaggle_p3_dual_gpu.sh
