name: VN97 P3 remote GPU bootstrap

on:
  push:
    branches:
      - p3-remote-gpu-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile tests/host_p3_remote_gpu_bootstrap.py
          python tests/host_p3_remote_gpu_bootstrap.py
          bash -n tools/bootstrap_p3_remote_gpu.sh
          bash -n tools/run_p3_gpu.sh
