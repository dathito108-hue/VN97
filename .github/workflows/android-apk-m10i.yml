name: VN97 JSONL Unicode line boundary hardening

on:
  push:
    branches:
      - jsonl-unicode-line-boundary-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile \
            src/vn97/corpus_io.py \
            src/vn97/training_cli.py \
            src/vn97/p2_corpus_intake_cli.py \
            src/vn97/p3_corpus_intake_cli.py \
            src/vn97/p2_corpus_bundle.py \
            src/vn97/p2_pilot_handoff.py \
            tests/host_jsonl_unicode_line_boundary.py
          python tests/host_jsonl_unicode_line_boundary.py
          python tests/host_production_corpus_v1.py
          python tests/host_p2_corpus_intake.py
          python tests/host_p3_foundation.py
