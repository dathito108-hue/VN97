name: VN97 P3 microbatch dual T4

on:
  push:
    branches:
      - p3-kaggle-microbatch-dual-t4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile microbatch pipeline
        run: |
          python -m py_compile \
            src/vn97/p3_tensor_cache.py \
            src/vn97/p3_kaggle_cached_candidate_cli.py

      - name: Validate logical-batch preservation and launcher
        run: |
          bash -n tools/kaggle_p3_dual_gpu.sh
          grep -q 'micro_batch_size' src/vn97/p3_tensor_cache.py
          grep -q 'micro_loss_sum' src/vn97/p3_tensor_cache.py
          grep -q '/ logical_targets' src/vn97/p3_tensor_cache.py
          grep -q 'steps += 1' src/vn97/p3_tensor_cache.py
          grep -q -- '--micro-batch-size' src/vn97/p3_kaggle_cached_candidate_cli.py
          grep -q 'default=2' src/vn97/p3_kaggle_cached_candidate_cli.py
          grep -q 'VN97_MICRO_BATCH_SIZE:-2' tools/kaggle_p3_dual_gpu.sh
          grep -q 'logical batch remains 8' tools/kaggle_p3_dual_gpu.sh
          grep -q 'CUDA_VISIBLE_DEVICES="$physical_gpu"' tools/kaggle_p3_dual_gpu.sh
