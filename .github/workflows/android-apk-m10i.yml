name: VN97 M19 final receipt immutability hardening

on:
  push:
    branches:
      - m19-final-receipt-immutability-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile hardened receipt paths
        run: |
          python -m compileall -q \
            src/vn97/production_materialization.py \
            src/vn97/turnkey_acceptance.py \
            tests/host_m19l_production_materialization.py \
            tests/host_m19m_turnkey_acceptance.py

      - name: M19L final materialization contracts
        run: python tests/host_m19l_production_materialization.py

      - name: M19M turnkey acceptance contracts
        run: python tests/host_m19m_turnkey_acceptance.py
