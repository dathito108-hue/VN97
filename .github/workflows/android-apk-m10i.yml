name: VN97 P3 GPU execution pack

on:
  push:
    branches:
      - p3-gpu-execution-pack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile P3 GPU execution pack
        run: |
          python -m py_compile \
            src/vn97/p3_gpu_preflight.py \
            src/vn97/p3_gpu_preflight_cli.py \
            tests/host_p3_gpu_execution_pack.py

      - name: Run P3 GPU execution host contract
        run: |
          python tests/host_p3_gpu_execution_pack.py
          bash -n tools/run_p3_gpu.sh

      - name: Regress P3 frozen campaign
        run: |
          python tests/host_p3_language_campaign.py
