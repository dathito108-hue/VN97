name: VN97 P0-P1 production intelligence closure

on:
  push:
    branches:
      - p0p1-production-intelligence-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile production corpus
        run: |
          python -m py_compile \
            src/vn97/production_corpus.py \
            src/vn97/production_corpus_cli.py \
            tests/host_production_corpus_v1.py

      - name: Production corpus v1 host contract
        run: python tests/host_production_corpus_v1.py
