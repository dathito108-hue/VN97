name: VN97 P3 explicit dual GPU

on:
  push:
    branches:
      - p3-kaggle-explicit-dual-gpu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate dual-GPU launcher
        run: |
          bash -n tools/kaggle_p3_dual_gpu.sh
          grep -q 'CUDA_VISIBLE_DEVICES="$physical_gpu"' tools/kaggle_p3_dual_gpu.sh
          grep -q 'candidate $first -> physical GPU 0' tools/kaggle_p3_dual_gpu.sh
          grep -q 'candidate $second -> physical GPU 1' tools/kaggle_p3_dual_gpu.sh
          grep -q 'nvidia-smi' tools/kaggle_p3_dual_gpu.sh
          grep -q 'OMP_NUM_THREADS' tools/kaggle_p3_dual_gpu.sh
