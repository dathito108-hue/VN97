name: VN97 M19M failure cleanup hardening

on:
  push:
    branches:
      - m19m-failure-cleanup-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile M19M
        run: |
          python -m compileall -q \
            src/vn97/turnkey_acceptance.py \
            tests/host_m19m_turnkey_acceptance.py

      - name: M19M turnkey acceptance contracts
        run: python tests/host_m19m_turnkey_acceptance.py
