name: VN97 P3 fast tokenizer sample

on:
  push:
    branches:
      - p3-fast-tokenizer-sample
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile updated P3 profile paths
        run: |
          python -m py_compile \
            src/vn97/tokenizer.py \
            src/vn97/campaign_cli.py \
            src/vn97/p3_language_campaign.py \
            src/vn97/p3_kaggle_prepare_cli.py \
            tests/host_fast_bpe_equivalence.py \
            tests/host_p3_language_campaign.py

      - name: Validate tokenizer semantics and P3 profile
        run: |
          python tests/host_fast_bpe_equivalence.py
          python tests/host_p3_language_campaign.py

      - name: Verify bounded tokenizer sampling path
        run: |
          grep -q -- '--tokenizer-max-records' src/vn97/campaign_cli.py
          grep -q 'TOKENIZER_TRAIN_RECORDS = 2048' src/vn97/p3_language_campaign.py
          grep -q 'LEARNED_TOKENS = 4096' src/vn97/p3_language_campaign.py
          grep -q 'select_deterministic_tokenizer_corpus' src/vn97/p3_kaggle_prepare_cli.py
