name: VN97 P4C core instruction cognition fine-tune

on:
  push:
    branches:
      - p4c-core-instruction-cognition-finetune
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4c-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.2"
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Compile P4C path
        run: |
          python -m py_compile \
            src/vn97/p4_core_curriculum.py \
            src/vn97/p4_core_finetune_cli.py \
            src/vn97/p3_tensor_cache.py \
            tests/host_p4_core_curriculum.py

      - name: Run P4/P4C contract tests
        run: |
          pytest -q \
            tests/host_p4_task_evaluation.py \
            tests/host_p4_core_curriculum.py

      - name: Verify progress/resume wiring
        run: |
          grep -q 'progress_protocol' src/vn97/p3_tensor_cache.py
          grep -q '"VN97 P4C"' src/vn97/p4_core_finetune_cli.py
          grep -q 'resume_checkpoint_path' src/vn97/p4_core_finetune_cli.py
          grep -q 'checkpoint_interval_steps' src/vn97/p4_core_finetune_cli.py
