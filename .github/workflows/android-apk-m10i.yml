name: VN97 P3 Kaggle sharded campaign

on:
  push:
    branches:
      - p3-kaggle-resumable-candidates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Kaggle sharded campaign
        run: |
          python -m py_compile \
            src/vn97/p3_kaggle.py \
            src/vn97/p3_kaggle_candidate_cli.py \
            src/vn97/p3_kaggle_finalize_cli.py \
            tests/host_p3_kaggle_sharded.py

      - name: Run host contract
        run: |
          python tests/host_p3_kaggle_sharded.py
          bash -n tools/kaggle_p3.sh

      - name: Verify sealed-release boundary
        run: |
          set -euo pipefail
          ! grep -q '"release.jsonl"' src/vn97/p3_kaggle_candidate_cli.py
          grep -q '"release.jsonl"' src/vn97/p3_kaggle_finalize_cli.py
          grep -q "select_best_campaign_candidate" src/vn97/p3_kaggle_finalize_cli.py
