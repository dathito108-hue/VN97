name: VN97 P2 closeout P3 foundation

on:
  push:
    branches:
      - p2-closeout-p3-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile \
            src/vn97/p2_corpus_intake.py \
            src/vn97/p3_corpus_intake_cli.py \
            tests/host_p3_foundation.py
          python tests/host_p2_corpus_intake.py
          python tests/host_p3_foundation.py
