name: VN97 P2 Vietnamese source count fix

on:
  push:
    branches:
      - p2-vi-source-count-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile src/vn97/p2_source_fetch.py src/vn97/p2_source_fetch_cli.py tests/host_p2_source_fetch.py
          python tests/host_p2_source_fetch.py
