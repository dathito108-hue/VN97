name: VN97 P2 medium pilot workflow contract

on:
  push:
    branches:
      - p2-medium-pilot-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-workflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile P2 pilot handoff
        run: |
          python -m py_compile \
            src/vn97/p2_pilot_handoff.py \
            src/vn97/p2_pilot_handoff_cli.py \
            tests/host_p2_pilot_handoff.py

      - name: P2 pilot handoff host contract
        run: python tests/host_p2_pilot_handoff.py

      - name: Validate manual workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/p2-corpus-preparation.yml"); puts "P2 corpus workflow YAML PASS"'
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/p2-medium-pilot.yml"); puts "P2 pilot workflow YAML PASS"'

      - name: Verify corpus workflow is torch-free
        run: |
          set -euo pipefail
          ! grep -q "pip install.*torch" .github/workflows/p2-corpus-preparation.yml
          grep -q "tools/p2_corpus_tool.py source-fetch" .github/workflows/p2-corpus-preparation.yml

      - name: Verify pilot workflow is manual and bounded
        run: |
          set -euo pipefail
          grep -q "workflow_dispatch" .github/workflows/p2-medium-pilot.yml
          grep -q "RUN_P2_MEDIUM_CPU_PILOT" .github/workflows/p2-medium-pilot.yml
          grep -q "timeout-minutes: 120" .github/workflows/p2-medium-pilot.yml
          grep -q "vn97-medium-pilot" .github/workflows/p2-medium-pilot.yml
          grep -q "vn97-p2-pilot-handoff seal-run" .github/workflows/p2-medium-pilot.yml
