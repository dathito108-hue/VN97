name: VN97 P3 language campaign runner

on:
  push:
    branches:
      - p3-language-campaign-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile \
            src/vn97/p3_language_campaign.py \
            src/vn97/p3_language_campaign_cli.py \
            tests/host_p3_language_campaign.py
          python tests/host_p3_language_campaign.py
          python tests/host_p3_foundation.py
