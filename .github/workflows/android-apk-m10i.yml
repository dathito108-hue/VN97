name: VN97 P2 public corpus intake

on:
  push:
    branches:
      - p2-corpus-intake-adapters
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile P2 corpus intake
        run: |
          python -m py_compile \
            src/vn97/p2_corpus_intake.py \
            src/vn97/p2_corpus_intake_cli.py \
            tests/host_p2_corpus_intake.py

      - name: P2 corpus intake host contract
        run: python tests/host_p2_corpus_intake.py
