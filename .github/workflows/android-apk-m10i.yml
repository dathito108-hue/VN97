name: VN97 P2 medium pilot runner

on:
  push:
    branches:
      - p2-medium-pilot-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile P2 runner
        run: |
          python -m py_compile \
            src/vn97/medium_pilot.py \
            src/vn97/medium_pilot_cli.py \
            tests/host_p2_medium_pilot.py

      - name: P2 medium pilot host contract
        run: python tests/host_p2_medium_pilot.py
