name: VN97 P3 live progress ETA

on:
  push:
    branches:
      - p3-live-progress-eta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile progress path
        run: |
          python -m py_compile \
            src/vn97/p3_tensor_cache.py \
            src/vn97/p3_kaggle_cached_candidate_cli.py

      - name: Validate progress/ETA contract
        run: |
          bash -n tools/kaggle_p3_dual_gpu.sh
          grep -q 'VN97 P3 PROGRESS' src/vn97/p3_tensor_cache.py
          grep -q 'percent=' src/vn97/p3_tensor_cache.py
          grep -q 'eta_s=' src/vn97/p3_tensor_cache.py
          grep -q 'step=' src/vn97/p3_tensor_cache.py
          grep -q -- '--progress-interval-steps' src/vn97/p3_kaggle_cached_candidate_cli.py
          grep -q 'VN97_PROGRESS_INTERVAL_STEPS' tools/kaggle_p3_dual_gpu.sh
          grep -q "grep 'VN97 P3 PROGRESS'" tools/kaggle_p3_dual_gpu.sh
