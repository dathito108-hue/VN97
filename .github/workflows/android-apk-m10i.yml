name: VN97 P3 Kaggle precompute dual GPU

on:
  push:
    branches:
      - p3-kaggle-precompute-dual-gpu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile new P3 cache path
        run: |
          python -m py_compile \
            src/vn97/tokenizer.py \
            src/vn97/p3_tensor_cache.py \
            src/vn97/p3_kaggle_prepare_cli.py \
            src/vn97/p3_kaggle_cached_candidate_cli.py \
            tests/host_fast_bpe_equivalence.py

      - name: Prove fast BPE exact equivalence
        run: python tests/host_fast_bpe_equivalence.py

      - name: Check dual-GPU launcher
        run: |
          bash -n tools/kaggle_p3_dual_gpu.sh
          grep -q 'run_pair 0 1' tools/kaggle_p3_dual_gpu.sh
          grep -q 'run_pair 2 3' tools/kaggle_p3_dual_gpu.sh
          grep -q 'cuda:0' tools/kaggle_p3_dual_gpu.sh
          grep -q 'cuda:1' tools/kaggle_p3_dual_gpu.sh
