name: VN97 Native State Foundation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vn97-native-state.yml'
      - 'research/vn97_native/**'
      - 'docs/vn97-native-architecture-path.md'
permissions:
  contents: read
concurrency:
  group: vn97-native-state-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check recurrent and scan semantics
        run: python -m unittest discover -s research/vn97_native -p 'test_adaptive_state.py' -v
  trainable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only training test dependency
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify oracle, gradients, checkpoints and synthetic optimization
        run: python -m unittest discover -s research/vn97_native -p 'test_trainable_state.py' -v
      - name: Verify VN97 backbone integration and candidate checkpoints
        run: python -m unittest discover -s research/vn97_native -p 'test_language_candidate.py' -v
      - name: Train fixed small candidate and evaluate disjoint records
        run: python research/vn97_native/evaluate_language_candidate.py --output /tmp/vn97-language-evidence
      - name: Preserve research weights, dataset and measured report
        uses: actions/upload-artifact@v4
        with:
          name: VN97-native-language-${{ github.run_id }}
          path: /tmp/vn97-language-evidence
          retention-days: 7
          if-no-files-found: error
      - name: Train bounded 10M CPU pilot
        if: github.head_ref == 'vn97-10m-cpu-pilot'
        run: python research/vn97_native/pilot_10m.py --output /tmp/vn97-10m-pilot
      - name: Preserve 10M report and split identities
        if: github.head_ref == 'vn97-10m-cpu-pilot'
        uses: actions/upload-artifact@v4
        with:
          name: VN97-10M-report-${{ github.run_id }}
          path: |
            /tmp/vn97-10m-pilot/report.json
            /tmp/vn97-10m-pilot/bundle-sha256.json
            /tmp/vn97-10m-pilot/dataset.json
          retention-days: 7
          if-no-files-found: error
      - name: Preserve exact 10M weights part 00
        if: github.head_ref == 'vn97-10m-cpu-pilot'
        uses: actions/upload-artifact@v4
        with:
          name: VN97-10M-part00-${{ github.run_id }}
          path: /tmp/vn97-10m-pilot/bundle.part00
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Preserve exact 10M weights part 01
        if: github.head_ref == 'vn97-10m-cpu-pilot'
        uses: actions/upload-artifact@v4
        with:
          name: VN97-10M-part01-${{ github.run_id }}
          path: /tmp/vn97-10m-pilot/bundle.part01
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
