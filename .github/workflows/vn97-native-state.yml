name: VN97 Native State Foundation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vn97-native-state.yml'
      - 'research/vn97_native/**'
      - 'docs/vn97-native-architecture-path.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: vn97-native-state-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check recurrent and scan semantics
        run: python -m unittest discover -s research/vn97_native -p 'test_adaptive_state.py' -v
      - name: Check curriculum split integrity
        run: python -m unittest discover -s research/vn97_native -p 'test_curriculum_data.py' -v
  trainable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only training test dependency
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify cell without optimizer or training
        run: |
          PYTHONPATH=research/vn97_native python - <<'PYTEST'
          import unittest
          from test_trainable_state import TrainableStateTests
          names = [n for n in unittest.defaultTestLoader.getTestCaseNames(TrainableStateTests)
                   if n != 'test_optimizer_reduces_synthetic_memory_task_loss']
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(TrainableStateTests(n) for n in names))
          raise SystemExit(not result.wasSuccessful())
          PYTEST
      - name: Verify VN97 backbone integration and candidate checkpoints
        run: python -m unittest discover -s research/vn97_native -p 'test_language_candidate.py' -v
      # Training remains paused by user request. Keep checkpoint scripts available,
      # but PR verification performs no optimizer steps or training campaigns.
      - name: Install portable inference dependencies
        run: python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1
      - name: Verify adaptive core export and real ONNX Runtime parity
        run: python -m unittest discover -s research/vn97_native -p 'test_portable_core.py' -v
