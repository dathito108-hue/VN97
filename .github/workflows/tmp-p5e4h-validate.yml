name: P5E4H temporary validation

on:
  push:
    branches:
      - p5e4h-fresh-post-prefix-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile src/vn97/p5e4h_fresh_post_prefix_validation_cli.py
      - name: Shell syntax
        run: bash -n tools/kaggle_p5e4h_validate.sh
      - name: P5E4H contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("src/vn97/p5e4h_fresh_post_prefix_validation_cli.py").read_text()
          pyproject = Path("pyproject.toml").read_text()
          launcher = Path("tools/kaggle_p5e4h_validate.sh").read_text()
          required = [
              "FRESH_PREFIX_GENERATION_GAIN",
              "FRESH_PREFIX_SIGNAL_GAIN",
              "reused_p5e4f_manifest",
              "QAT_MIN_GENERATION_RATE = 0.10",
              "parent_adapter_sha256",
              "PREFIX_DECODING_REPAIR_SIGNAL",
              "ready_for_next_decoding_stage",
          ]
          missing = [item for item in required if item not in src]
          assert not missing, missing
          assert 'vn97-p5e4h-validate = "vn97.p5e4h_fresh_post_prefix_validation_cli:main"' in pyproject
          assert "python -m vn97.p5e4h_fresh_post_prefix_validation_cli" in launcher
          PY
