name: VN97 P5D4A HF Cache Path Validate

on:
  push:
    branches:
      - p5d4a-hf-hub-cache-path-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n tools/kaggle_p5d4a_teacher_expansion.sh
      - name: HF hub cache path contract
        run: |
          grep -q 'Path(os.environ\["HF_HOME"\]) / "hub"' tools/kaggle_p5d4a_teacher_expansion.sh
          grep -q 'local_files_only=False' tools/kaggle_p5d4a_teacher_expansion.sh
          grep -q 'force_download=True' tools/kaggle_p5d4a_teacher_expansion.sh
